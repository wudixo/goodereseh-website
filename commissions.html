<script>
var RAIL = 'https://goodereseh-website-production.up.railway.app';

var SYS = `
You are the Good Ereseh Commission Assistant.

You are not a generic chatbot and you are not an automatic image generator.
Your job is to help customers develop a clear commission brief for Good Ereseh, a London-based charcoal and graphite artist.

BRAND

Good Ereseh creates hand-drawn charcoal and graphite artworks focused on portraiture, emotion, memory, identity, presence and visual storytelling.

Sound warm, intelligent, concise, creative, professional and calm.
Do not sound robotic.
Do not pressure the customer.
Do not pretend to be Good Ereseh himself.

CORE RULES

Help the customer shape an idea that Good Ereseh can review and create by hand.

Ask one or two focused questions at a time.

Remember earlier answers and do not repeat questions unless clarification is needed.

If the customer is unsure, act as an art adviser and offer useful creative options.

Never invent customer facts.

Never claim information has been saved before the website submits it.

Before submission say that you have enough information to prepare the request, not that you have saved it.

Never claim a commission is accepted until Good Ereseh reviews it.

Never claim payment succeeded unless payment confirmation is available.

REFERENCE PHOTOS

If a customer uploads a photo, treat it only as a reference image.

Never regenerate, replace or recreate an uploaded photo.

Analyse it only for composition, pose, expression, lighting, clothing, background, facial detail and suitability for charcoal artwork.

Refer to each image by its exact label such as Reference 1 or Reference 2.

If there are multiple images, help the customer explain how each should be used.

Do not force the customer to choose again if they have already explained the role of earlier images.

If one image is clearer for facial likeness, you may recommend it, but the customer makes the choice.

NO REFERENCE PHOTO

If no photo is uploaded, help develop the idea through conversation.

Ask about subject, number of people, pose, expression, clothing, setting, background, mood, symbolism, occasion, meaning, display location and preferred size.

Do not generate an image.

COMMISSION TYPES

A) Personal Portrait
B) Family Artwork
C) Couple Portrait
D) Memorial Piece
E) Conceptual Artwork
F) Gift Commission
G) Cultural or Legacy Piece
H) Other

ARTISTIC GUIDANCE

You may advise on photo quality, facial detail, lighting, crop, suitable artwork size, background simplicity and whether another reference would help.

Good Ereseh makes the final artistic decision.

MEDIUM

Default medium: charcoal and graphite on archival cotton paper.

Do not promise another medium unless Good Ereseh confirms it.

SIZE

Use A4, A3, A2, A1 or Large Custom.

Do not invent prices.

Larger sizes, more subjects and more complex backgrounds can affect pricing.

FRAMING

Do not ask about framing.

Do not recommend framing.

Do not include framing in the commission brief.

Good Ereseh handles framing separately if required.

PAYMENT

Do not ask for payment during the chat.

The flow is:

1. Gather the commission brief
2. Gather customer details
3. Submit the request
4. Good Ereseh reviews it
5. A concept may be prepared privately
6. Customer approves
7. Good confirms the quote
8. Customer receives a private payment link

FINAL DETAILS

Before submission, the website will collect full name, email, phone number and delivery address.

The chat should confirm artwork type, number of subjects, selected reference image or images, size and special instructions.

Before submission, confirm the customer has permission to provide and use any reference photographs.

OPTIONS

When giving selectable options, format them exactly like this:

A) Option text
B) Option text
C) Option text

Do not put bullets before A), B), C).

FINAL BRIEF

When enough information has been collected, give a concise final brief using short labelled lines covering only facts actually agreed.

Then write COLLECT_DETAILS on its own line.

Never write GENERATE_CONCEPT.

Never write PROMPT:.

The customer-facing assistant must never generate artwork.

LIVE INFORMATION

If asked about time-sensitive information, do not pretend you know the latest information unless live search results have been provided.

Say Good Ereseh will verify the current reference before preparing the concept.
`;

var chatHistory = [];
var references = [];
var pendingRef = null;
var collecting = false;
var recog = null;
var recOn = false;
var finalBrief = '';

var cmIn = document.getElementById('cmIn');
var cmOut = document.getElementById('cmOut');
var ibTa = document.getElementById('ibTa');
var ibUp = document.getElementById('ibUp');
var hint = document.getElementById('ibHint');


function wait(ms) {
    return new Promise(function(resolve) {
        setTimeout(resolve, ms);
    });
}


function sb() {

    setTimeout(function() {

        cmOut.scrollTop =
            cmOut.scrollHeight;

    }, 60);

}


function esc(value) {

    if (!value) {
        return '';
    }

    return String(value)

        .replace(/&/g, '&amp;')

        .replace(/</g, '&lt;')

        .replace(/>/g, '&gt;')

        .replace(/"/g, '&quot;');

}


function cur(el) {

    el.querySelectorAll(
        'button,input,textarea,select'
    )

    .forEach(function(item) {

        item.addEventListener(
            'mouseenter',
            function() {

                document.body
                    .classList
                    .add(
                        'cursor-hover'
                    );

            }
        );


        item.addEventListener(
            'mouseleave',
            function() {

                document.body
                    .classList
                    .remove(
                        'cursor-hover'
                    );

            }
        );

    });

}


function addAI(html) {

    var div =
        document.createElement(
            'div'
        );

    div.className =
        'msg ai';


    div.innerHTML =

        '<div class="mav">G</div>' +

        '<div class="bbl">' +

        html +

        '</div>';


    cmIn.appendChild(div);

    sb();

    cur(div);

    return div;

}


function addUser(
    text,
    imgUrl,
    label
) {

    var div =
        document.createElement(
            'div'
        );

    div.className =
        'msg u';


    var image = '';


    if (imgUrl) {

        image =

            '<div class="ref-thumb">' +

                '<div style="font-size:10px;color:var(--g1);margin-bottom:5px;">' +

                    esc(
                        label ||
                        'Reference'
                    ) +

                '</div>' +

                '<img src="' +
                    imgUrl +
                    '" alt="">' +

            '</div>';

    }


    div.innerHTML =

        '<div class="bbl">' +

        image +

        (
            text

                ? '<p>' +
                    esc(text) +
                    '</p>'

                : ''
        ) +

        '</div>';


    cmIn.appendChild(div);

    sb();

}


async function aiTyping(ms) {

    var typing =
        document.createElement(
            'div'
        );


    typing.className =
        'msg ai';


    typing.innerHTML =

        '<div class="mav">G</div>' +

        '<div class="bbl">' +

            '<div class="ty">' +

                '<span></span>' +

                '<span></span>' +

                '<span></span>' +

            '</div>' +

        '</div>';


    cmIn.appendChild(
        typing
    );


    sb();


    await wait(
        ms || 700
    );


    typing.remove();

}


function renderAI(text) {

    var lines =
        String(
            text || ''
        )
        .split('\n');


    var html = '';

    var inParagraph =
        false;


    lines.forEach(
        function(line) {

            var option =
                line.match(
                    /^([A-H])\)\s+(.+)$/
                );


            if (option) {

                if (
                    inParagraph
                ) {

                    html +=
                        '</p>';

                    inParagraph =
                        false;

                }


                html +=

                    '<button class="opt-btn"' +

                    ' data-full="' +

                    esc(
                        option[1] +
                        ') ' +
                        option[2]
                    ) +

                    '"' +

                    ' onclick="pickOpt(this)">' +

                    '<span class="ol">' +

                    option[1] +

                    '</span>' +

                    esc(
                        option[2]
                    ) +

                    '</button>';


                return;

            }


            var cleaned =
                line.trim();


            if (
                cleaned ===
                'COLLECT_DETAILS'
            ) {

                return;

            }


            if (cleaned) {

                if (
                    !inParagraph
                ) {

                    html +=
                        '<p>';

                    inParagraph =
                        true;

                }

                else {

                    html +=
                        ' ';

                }


                html +=
                    esc(cleaned);

            }

            else if (
                inParagraph
            ) {

                html +=
                    '</p>';

                inParagraph =
                    false;

            }

        }
    );


    if (inParagraph) {

        html +=
            '</p>';

    }


    return html;

}


async function callAI(
    userText,
    refObj,
    displayText
) {

    var content = [];


    if (
        refObj &&
        refObj.b64 &&
        refObj.type
    ) {

        content.push({

            type:
                'image',

            source: {

                type:
                    'base64',

                media_type:
                    refObj.type,

                data:
                    refObj.b64

            }

        });

    }


    if (userText) {

        content.push({

            type:
                'text',

            text:
                userText

        });

    }


    if (!content.length) {

        return null;

    }


    chatHistory.push({

        role:
            'user',

        content:

            content.length === 1 &&
            content[0].type === 'text'

                ? userText

                : content,

        displayText:

            displayText !== undefined

                ? displayText

                : userText

    });


    try {

        var response =
            await fetch(

                RAIL +
                '/chat',

                {

                    method:
                        'POST',

                    headers: {

                        'Content-Type':
                            'application/json'

                    },

                    body:
                        JSON.stringify({

                            system:
                                SYS,

                            messages:
                                chatHistory

                        })

                }

            );


        var data =
            await response.json();


        if (!response.ok) {

            throw new Error(

                data.error ||

                'Unable to reach the studio assistant.'

            );

        }


        chatHistory.push({

            role:
                'assistant',

            content:
                data.text,

            displayText:
                data.text

        });


        return data.text;

    }

    catch (error) {

        console.error(

            'callAI error:',

            error.message

        );


        return (
            'The studio assistant is temporarily unavailable. ' +
            'Please wait a moment and try again.'
        );

    }

}


function disableAllOptions() {

    document
        .querySelectorAll(
            '.opt-btn'
        )
        .forEach(
            function(button) {

                button.disabled =
                    true;

            }
        );

}


function wantsDetailsForm(text) {

    var value =
        String(
            text || ''
        )
        .toLowerCase();


    return (

        /fill\s+(the\s+)?form/.test(value) ||

        /complete\s+(the\s+)?form/.test(value) ||

        /submit\s+(my\s+)?commission/.test(value) ||

        /ready\s+to\s+submit/.test(value) ||

        /that\s+is\s+all/.test(value) ||

        /that's\s+all/.test(value)

    );

}


async function processAI(text) {

    if (
        !text ||
        !String(text).trim()
    ) {

        addAI(
            renderAI(
                'I did not quite catch that. Could you please try again or rephrase your message?'
            )
        );

        return;

    }


    if (
        text.includes(
            'COLLECT_DETAILS'
        )
    ) {

        var clean =
            text
                .replace(
                    'COLLECT_DETAILS',
                    ''
                )
                .trim();


        finalBrief =
            clean;


        disableAllOptions();


        if (clean) {

            addAI(
                renderAI(
                    clean
                )
            );

        }


        await wait(250);


        showBriefForm();


        return;

    }


    addAI(
        renderAI(
            text
        )
    );

}


function pickOpt(button) {

    if (
        button.disabled ||
        collecting
    ) {

        return;

    }


    button
        .closest(
            '.bbl'
        )
        .querySelectorAll(
            '.opt-btn'
        )
        .forEach(
            function(item) {

                item.disabled =
                    true;

            }
        );


    button
        .classList
        .add(
            'sel'
        );


    var full =

        button.dataset.full ||

        button
            .textContent
            .trim();


    addUser(
        full
    );


    disableInput();


    sendToAI(
        full,
        null,
        full
    );

}


function doSend() {

    if (collecting) {

        return;

    }


    var text =
        ibTa.value.trim();


    if (
        !text &&
        !pendingRef
    ) {

        return;

    }


    var ref =
        pendingRef;


    var refLabel =

        ref

            ? ref.label

            : null;


    var preview =

        ref

            ? ref.preview

            : null;


    ibTa.value =
        '';


    ibTa.style.height =
        'auto';


    if (ref) {

        clearPendingRef(
            false
        );

    }


    refreshSend();


    addUser(
        text,
        preview,
        refLabel
    );


    disableInput();


    var aiText =
        text;


    var displayText =
        text;


    if (ref) {

        var refCount =
            references.length;


        var context =

            'The customer has uploaded ' +

            refLabel +

            '. This image is an original reference photograph. ' +

            'Do not regenerate or replace it. ' +

            'Analyse it only for the commission. ';


        if (
            refCount > 1
        ) {

            context +=

                'There are now ' +

                refCount +

                ' reference photographs. ' +

                'Ask how this new reference should be used in relation to the earlier references. ' +

                'Do not force the customer to choose again if the role of earlier images is already clear. ';

        }


        aiText =

            context +

            (
                text

                    ? 'Customer message: ' +
                        text

                    : 'Ask how they would like this reference used in the artwork.'
            );


        displayText =

            text ||

            (
                'Uploaded ' +
                refLabel
            );

    }


    if (
        !ref &&
        wantsDetailsForm(
            text
        )
    ) {

        aiText =

            'The customer is ready to submit. ' +

            'Based on the conversation so far, write a concise final commission brief using short labelled lines for artwork type, subjects, reference images and how each should be used, size, composition or background, and special instructions that were actually agreed. ' +

            'Do not invent anything. ' +

            'Do not mention framing. ' +

            'Then write COLLECT_DETAILS on its own line. ' +

            'Customer message: ' +

            text;

    }


    sendToAI(
        aiText,
        ref,
        displayText
    );

}


async function sendToAI(
    text,
    refObj,
    displayText
) {

    if (collecting) {

        return;

    }


    await aiTyping(
        700
    );


    var aiText =
        await callAI(
            text,
            refObj,
            displayText
        );


    await processAI(
        aiText
    );


    if (!collecting) {

        enableInput();

    }

}


ibTa.addEventListener(
    'input',
    function() {

        ibTa.style.height =
            'auto';


        ibTa.style.height =

            Math.min(
                ibTa.scrollHeight,
                120
            ) +

            'px';


        refreshSend();

    }
);


ibTa.addEventListener(
    'keydown',
    function(event) {

        if (
            event.key ===
                'Enter' &&

            !event.shiftKey &&

            !ibUp.disabled
        ) {

            event.preventDefault();

            doSend();

        }

    }
);


function refreshSend() {

    var ok =

        ibTa.value
            .trim()
            .length > 0 ||

        !!pendingRef;


    ibUp.disabled =
        !ok;


    ibUp
        .classList
        .toggle(
            'on',
            ok
        );

}


function enableInput() {

    ibTa.disabled =
        false;


    hint.textContent =
        '';


    setTimeout(
        function() {

            ibTa.focus();

        },
        80
    );


    refreshSend();

}


function disableInput() {

    ibTa.disabled =
        true;


    ibUp.disabled =
        true;


    ibUp
        .classList
        .remove(
            'on'
        );


    hint.textContent =
        '';

}


function onFile(input) {

    var file =
        input.files[0];


    if (!file) {

        return;

    }


    if (
        references.length >=
        6
    ) {

        addAI(
            '<p>You can attach up to 6 reference photographs to one commission request.</p>'
        );

        input.value =
            '';

        return;

    }


    var canvas =
        document.createElement(
            'canvas'
        );


    var ctx =
        canvas.getContext(
            '2d'
        );


    var image =
        new Image();


    image.onload =
        function() {

            var width =
                image.width;


            var height =
                image.height;


            var max =
                1200;


            if (
                width >
                max
            ) {

                height =
                    Math.round(
                        height *
                        max /
                        width
                    );

                width =
                    max;

            }


            if (
                height >
                max
            ) {

                width =
                    Math.round(
                        width *
                        max /
                        height
                    );

                height =
                    max;

            }


            canvas.width =
                width;


            canvas.height =
                height;


            ctx.drawImage(
                image,
                0,
                0,
                width,
                height
            );


            var dataUrl =
                canvas.toDataURL(
                    'image/jpeg',
                    0.82
                );


            var ref = {

                id:

                    'ref_' +

                    Date.now() +

                    '_' +

                    Math.random()
                        .toString(36)
                        .slice(
                            2,
                            7
                        ),

                label:

                    'Reference ' +

                    (
                        references.length +
                        1
                    ),

                name:
                    file.name,

                b64:
                    dataUrl
                        .split(',')[1],

                type:
                    'image/jpeg',

                preview:
                    dataUrl

            };


            references.push(
                ref
            );


            pendingRef =
                ref;


            updatePendingStrip();


            refreshSend();


            input.value =
                '';

        };


    image.src =
        URL.createObjectURL(
            file
        );

}


function updatePendingStrip() {

    var strip =
        document.getElementById(
            'imgStrip'
        );


    if (!pendingRef) {

        strip
            .classList
            .remove(
                'on'
            );

        return;

    }


    document.getElementById(
        'ipThumb'
    ).src =
        pendingRef.preview;


    document.getElementById(
        'ipName'
    ).textContent =

        pendingRef.label +

        ' · ' +

        pendingRef.name;


    strip
        .classList
        .add(
            'on'
        );

}


function clearPendingRef(
    removeFromReferences
) {

    if (
        pendingRef &&
        removeFromReferences !==
            false
    ) {

        references =
            references.filter(
                function(ref) {

                    return (
                        ref.id !==
                        pendingRef.id
                    );

                }
            );

    }


    pendingRef =
        null;


    document.getElementById(
        'imgStrip'
    )
    .classList
    .remove(
        'on'
    );


    refreshSend();

}


function clearImg() {

    clearPendingRef(
        true
    );

}


function cleanHistoryText(message) {

    var text =

        message.displayText !==
        undefined

            ? message.displayText

            : (
                typeof message.content ===
                'string'

                    ? message.content

                    : ''
            );


    if (
        !text &&
        Array.isArray(
            message.content
        )
    ) {

        text =
            message.content

                .filter(
                    function(part) {

                        return (
                            part.type ===
                            'text'
                        );

                    }
                )

                .map(
                    function(part) {

                        return part.text;

                    }
                )

                .join(' ');

    }


    text =
        String(
            text || ''
        )

        .replace(
            /COLLECT_DETAILS/g,
            ''
        )

        .trim();


    if (
        /^The customer has uploaded Reference \d+/i
            .test(
                text
            )
    ) {

        return '';

    }


    return text;

}


function buildConversationSummary() {

    return chatHistory

        .map(
            function(message) {

                var text =
                    cleanHistoryText(
                        message
                    );


                if (!text) {

                    return '';

                }


                return (

                    message.role ===
                    'assistant'

                        ? 'Assistant: '

                        : 'Customer: '

                ) +

                text;

            }
        )

        .filter(Boolean)

        .join(
            '\n\n'
        );

}


function buildConversationPayload() {

    return chatHistory

        .map(
            function(message) {

                var text =
                    cleanHistoryText(
                        message
                    );


                if (!text) {

                    return null;

                }


                return {

                    role:

                        message.role ===
                        'assistant'

                            ? 'assistant'

                            : 'user',

                    text:
                        text

                };

            }
        )

        .filter(Boolean);

}

    if (collecting) {

        return;

    }


    collecting =
        true;


    disableAllOptions();


    var block =
        document.createElement(
            'div'
        );


    block.className =
        'bf-block';


    block.innerHTML = `

        <div
            class="bf-card"
            id="bfCard"
            style="max-width:430px;"
        >

            <div
                style="
                    font-family:var(--serif);
                    font-size:18px;
                    color:var(--p2);
                    margin-bottom:4px;
                "
            >
                Your details
            </div>


            <div
                style="
                    font-size:11px;
                    color:var(--g1);
                    line-height:1.6;
                    margin-bottom:5px;
                "
            >
                Your commission is not confirmed yet.
                Good Ereseh will review the brief and send your quote and private payment link after approval.
            </div>


            <input
                class="bf-inp"
                type="text"
                id="bfN"
                placeholder="Full name"
                autocomplete="name"
            >


            <input
                class="bf-inp"
                type="email"
                id="bfE"
                placeholder="Email address"
                autocomplete="email"
            >


            <input
                class="bf-inp"
                type="tel"
                id="bfP"
                placeholder="Phone number"
                autocomplete="tel"
            >


            <input
                class="bf-inp"
                type="text"
                id="bfA1"
                placeholder="Address line 1"
                autocomplete="address-line1"
            >


            <input
                class="bf-inp"
                type="text"
                id="bfA2"
                placeholder="Address line 2 (optional)"
                autocomplete="address-line2"
            >


            <input
                class="bf-inp"
                type="text"
                id="bfCity"
                placeholder="City"
                autocomplete="address-level2"
            >


            <input
                class="bf-inp"
                type="text"
                id="bfCounty"
                placeholder="County / Region"
                autocomplete="address-level1"
            >


            <input
                class="bf-inp"
                type="text"
                id="bfPost"
                placeholder="Postcode"
                autocomplete="postal-code"
            >


            <input
                class="bf-inp"
                type="text"
                id="bfCountry"
                placeholder="Country"
                autocomplete="country-name"
            >


            <textarea
                class="bf-inp"
                id="bfNotes"
                rows="3"
                placeholder="Final notes or delivery instructions"
            ></textarea>


            <label
                style="
                    display:flex;
                    gap:8px;
                    align-items:flex-start;
                    font-size:10px;
                    color:var(--g2);
                    line-height:1.55;
                "
            >

                <input
                    type="checkbox"
                    id="bfConsent"
                    style="margin-top:3px;"
                >

                <span>
                    I confirm I have permission to provide and use any reference photographs submitted with this commission.
                </span>

            </label>


            <button
                class="bf-btn"
                onclick="submitBrief()"
            >
                Submit Commission Request →
            </button>


            <div
                class="bf-err"
                id="bfErr"
            ></div>

        </div>


        <div
            id="payWrap"
            style="display:none;"
        ></div>

    `;


    cmIn.appendChild(
        block
    );


    sb();

    cur(block);

    disableInput();

}


async function submitBrief() {

    var name =
        document
            .getElementById(
                'bfN'
            )
            .value
            .trim();


    var email =
        document
            .getElementById(
                'bfE'
            )
            .value
            .trim();


    var phone =
        document
            .getElementById(
                'bfP'
            )
            .value
            .trim();


    var address1 =
        document
            .getElementById(
                'bfA1'
            )
            .value
            .trim();


    var address2 =
        document
            .getElementById(
                'bfA2'
            )
            .value
            .trim();


    var city =
        document
            .getElementById(
                'bfCity'
            )
            .value
            .trim();


    var county =
        document
            .getElementById(
                'bfCounty'
            )
            .value
            .trim();


    var postcode =
        document
            .getElementById(
                'bfPost'
            )
            .value
            .trim();


    var country =
        document
            .getElementById(
                'bfCountry'
            )
            .value
            .trim();


    var notes =
        document
            .getElementById(
                'bfNotes'
            )
            .value
            .trim();


    var consent =
        document
            .getElementById(
                'bfConsent'
            )
            .checked;


    var errorBox =
        document
            .getElementById(
                'bfErr'
            );


    var button =
        document
            .querySelector(
                '.bf-btn'
            );


    if (
        !name ||
        !email ||
        !phone ||
        !address1 ||
        !city ||
        !postcode ||
        !country
    ) {

        errorBox.textContent =
            'Please complete your contact and delivery details.';


        errorBox.style.display =
            'block';


        return;

    }


    if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(
                email
            )
    ) {

        errorBox.textContent =
            'Please enter a valid email address.';


        errorBox.style.display =
            'block';


        return;

    }


    if (
        references.length &&
        !consent
    ) {

        errorBox.textContent =
            'Please confirm the reference-photo permission statement.';


        errorBox.style.display =
            'block';


        return;

    }


    var summary =

        finalBrief ||

        buildConversationSummary();


    var conversationPayload =
        buildConversationPayload();


    var referencePayload =

        references.map(
            function(ref) {

                return {

                    label:
                        ref.label,

                    name:
                        ref.name,

                    imageB64:
                        ref.b64,

                    imageType:
                        ref.type

                };

            }
        );


    button.textContent =
        'Submitting…';


    button.disabled =
        true;


    errorBox.style.display =
        'none';


    try {

        var response =
            await fetch(

                RAIL +
                '/commission',

                {

                    method:
                        'POST',

                    headers: {

                        'Content-Type':
                            'application/json'

                    },

                    body:
                        JSON.stringify({

                            name:
                                name,

                            email:
                                email,

                            phone:
                                phone,

                            'commission-type':
                                'AI Guided Commission',

                            size:
                                '',

                            message:
                                summary,

                            conversation:
                                conversationPayload,

                            references:
                                referencePayload,

                            address: {

                                line1:
                                    address1,

                                line2:
                                    address2,

                                city:
                                    city,

                                county:
                                    county,

                                postcode:
                                    postcode,

                                country:
                                    country

                            },

                            notes:
                                notes,

                            referenceConsent:

                                references.length

                                    ? consent

                                    : true

                        })

                }

            );


        var data =
            await response.json();


        if (!response.ok) {

            throw new Error(

                data.error ||

                'Unable to submit commission request.'

            );

        }


        document
            .getElementById(
                'bfCard'
            )
            .style
            .display =
                'none';


        var wrap =
            document.getElementById(
                'payWrap'
            );


        wrap.style.display =
            'block';


        wrap.innerHTML =

            '<div class="bf-card" style="max-width:430px;">' +

                '<div style="font-family:var(--serif);font-size:19px;color:var(--p2);">' +

                    'Commission request received.' +

                '</div>' +

                '<p style="font-size:12px;color:var(--g2);line-height:1.75;margin-top:8px;">' +

                    (
                        data.commissionNumber

                            ? (
                                'Reference: <strong>' +

                                esc(
                                    data.commissionNumber
                                ) +

                                '</strong><br><br>'
                            )

                            : ''
                    ) +

                    'Good Ereseh will review your brief and reference photographs. ' +

                    'Your quote and private payment link will follow after review.' +

                '</p>' +

            '</div>';


        sb();

    }

    catch (error) {

        errorBox.textContent =

            error.message ||

            'Error. Email art@goodereseh.com';


        errorBox.style.display =
            'block';


        button.textContent =
            'Submit Commission Request →';


        button.disabled =
            false;

    }

}


function toggleMic() {

    var SpeechRecognition =

        window.SpeechRecognition ||

        window.webkitSpeechRecognition;


    var micButton =
        document.getElementById(
            'micBtn'
        );


    if (!SpeechRecognition) {

        addAI(
            '<p>Voice input is not supported in this browser. Please type your message instead.</p>'
        );

        return;

    }


    if (recOn) {

        if (recog) {

            recog.stop();

        }


        recOn =
            false;


        micButton
            .classList
            .remove(
                'rc'
            );


        return;

    }


    recog =
        new SpeechRecognition();


    recog.lang =
        'en-GB';


    recog.continuous =
        false;


    recog.interimResults =
        true;


    recog.onstart =
        function() {

            recOn =
                true;


            micButton
                .classList
                .add(
                    'rc'
                );

        };


    recog.onresult =
        function(event) {

            var text =

                Array.from(
                    event.results
                )

                .map(
                    function(result) {

                        return (
                            result[0]
                                .transcript
                        );

                    }
                )

                .join('');


            ibTa.value =
                text;


            ibTa.style.height =
                'auto';


            ibTa.style.height =

                Math.min(
                    ibTa.scrollHeight,
                    120
                ) +

                'px';


            refreshSend();

        };


    recog.onend =
        function() {

            recOn =
                false;


            micButton
                .classList
                .remove(
                    'rc'
                );

        };


    recog.onerror =
        function() {

            recOn =
                false;


            micButton
                .classList
                .remove(
                    'rc'
                );

        };


    recog.start();

}

var cdot =
    document.getElementById(
        'cDot'
    );


var cring =
    document.getElementById(
        'cRing'
    );


if (
    window
        .matchMedia(
            '(pointer: fine)'
        )
        .matches
) {

    var mx =
        0;

    var my =
        0;

    var rx =
        0;

    var ry =
        0;

    var trailTimer =
        0;


    document.addEventListener(

        'mousemove',

        function(event) {

            mx =
                event.clientX;

            my =
                event.clientY;


            cdot.style.left =
                mx +
                'px';


            cdot.style.top =
                my +
                'px';


            clearTimeout(
                trailTimer
            );


            trailTimer =
                setTimeout(

                    function() {

                        var trail =
                            document.createElement(
                                'div'
                            );


                        trail.className =
                            'cursor-trail';


                        trail.style.left =
                            mx +
                            'px';


                        trail.style.top =
                            my +
                            'px';


                        document.body
                            .appendChild(
                                trail
                            );


                        trail.addEventListener(

                            'animationend',

                            function() {

                                trail.remove();

                            }

                        );

                    },

                    16

                );

        }

    );


    (
        function loop() {

            rx +=
                (
                    mx -
                    rx
                ) *
                0.12;


            ry +=
                (
                    my -
                    ry
                ) *
                0.12;


            cring.style.left =
                rx +
                'px';


            cring.style.top =
                ry +
                'px';


            requestAnimationFrame(
                loop
            );

        }
    )();


    document
        .querySelectorAll(
            'a,button'
        )
        .forEach(
            function(element) {

                element
                    .addEventListener(

                        'mouseenter',

                        function() {

                            document.body
                                .classList
                                .add(
                                    'cursor-hover'
                                );

                        }

                    );


                element
                    .addEventListener(

                        'mouseleave',

                        function() {

                            document.body
                                .classList
                                .remove(
                                    'cursor-hover'
                                );

                        }

                    );

            }
        );

}
