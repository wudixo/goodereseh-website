<style>

html,
body{
    height:100%;
    overflow:hidden;
}

.cp{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    background:var(--ink);
}

#nav{
    position:relative;
    flex-shrink:0;
    z-index:10;
}

.ch{
    flex-shrink:0;
    border-bottom:1px solid rgba(189,179,168,.07);
}

.ch-in{
    max-width:680px;
    margin:0 auto;
    padding:11px 20px;
    display:flex;
    align-items:center;
    gap:11px;
}

.av{
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--c2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--serif);
    font-size:11px;
    color:var(--g3);
    position:relative;
    flex-shrink:0;
}

.av::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:50%;
    background:conic-gradient(
        from 0deg,
        #6366f1,
        #0ea5e9,
        #06b6d4,
        #7c3aed,
        #6366f1
    );
    animation:sp 5s linear infinite;
    z-index:-1;
    filter:blur(3px);
    opacity:.55;
}

@keyframes sp{
    to{
        transform:rotate(360deg);
    }
}

.ch-name{
    font-family:var(--serif);
    font-size:14px;
    font-weight:300;
    color:var(--p2);
}

.ch-sub{
    font-size:9px;
    color:var(--g1);
    letter-spacing:.08em;
    margin-top:1px;
}

.ch-dot{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:9px;
    color:var(--g1);
    margin-left:auto;
}

.ch-dot i{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#10b981;
    display:block;
}

.cm-out{
    flex:1;
    overflow-y:auto;
}

.cm-out::-webkit-scrollbar{
    width:3px;
}

.cm-out::-webkit-scrollbar-thumb{
    background:var(--g0);
    border-radius:2px;
}

.cm-in{
    max-width:680px;
    margin:0 auto;
    padding:18px 20px 8px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.msg{
    display:flex;
    gap:9px;
    align-items:flex-start;
    animation:mi .35s ease forwards;
    opacity:0;
}

@keyframes mi{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.msg.u{
    flex-direction:row-reverse;
}

.mav{
    width:27px;
    height:27px;
    border-radius:50%;
    background:var(--c2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--serif);
    font-size:10px;
    color:var(--g3);
    flex-shrink:0;
    margin-top:2px;
    position:relative;
}

.mav::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:50%;
    background:conic-gradient(
        from 0deg,
        #6366f1,
        #0ea5e9,
        #6366f1
    );
    animation:sp 3s linear infinite;
    z-index:-1;
    filter:blur(2px);
    opacity:.35;
}

.bbl{
    padding:10px 14px;
    font-size:13.5px;
    line-height:1.72;
    border-radius:14px;
    color:var(--p1);
}

.msg.ai .bbl{
    background:var(--c1);
    border:1px solid rgba(189,179,168,.07);
    border-top-left-radius:3px;
    max-width:78%;
}

.msg.u .bbl{
    background:rgba(99,102,241,.15);
    border:1px solid rgba(99,102,241,.2);
    border-top-right-radius:3px;
    max-width:80%;
    margin-left:auto;
}

.bbl p{
    margin:0;
}

.bbl p+p{
    margin-top:6px;
}

.opt-btn{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 13px;
    margin-top:5px;
    background:var(--c2);
    border:1px solid rgba(189,179,168,.1);
    color:var(--g2);
    font-family:var(--sans);
    font-size:13px;
    text-align:left;
    cursor:none;
    border-radius:9px;
    transition:border-color .2s,color .2s;
    width:100%;
}

.opt-btn:hover:not(:disabled){
    border-color:#6366f1;
    color:var(--p1);
}

.opt-btn:disabled{
    opacity:.45;
    pointer-events:none;
}

.opt-btn.sel{
    border-color:#0ea5e9;
    color:var(--p1);
}

.ol{
    width:21px;
    height:21px;
    border-radius:50%;
    background:rgba(189,179,168,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    color:var(--g3);
    flex-shrink:0;
}

.ty{
    display:flex;
    gap:4px;
    padding:5px 2px;
    align-items:center;
}

.ty span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--g1);
    animation:td 1.2s ease-in-out infinite;
}

.ty span:nth-child(2){
    animation-delay:.2s;
}

.ty span:nth-child(3){
    animation-delay:.4s;
}

@keyframes td{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }

    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}

.ref-thumb{
    max-width:160px;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:6px;
}

.ref-thumb img{
    width:100%;
    display:block;
}

.bf-block{
    animation:mi .35s ease forwards;
    opacity:0;
}

.bf-card{
    background:var(--c1);
    border:1px solid rgba(189,179,168,.08);
    border-radius:10px;
    padding:15px;
    max-width:320px;

    flex-direction:column;
    gap:8px;
}

.bf-inp{
    background:var(--c2);
    border:1px solid rgba(189,179,168,.1);
    color:var(--p1);
    font-family:var(--sans);
    font-size:13px;
    font-weight:300;
    padding:10px 13px;
    outline:none;
    border-radius:7px;
    transition:border-color .25s;
}

.bf-inp:focus{
    border-color:#0ea5e9;
}

.bf-inp::placeholder{
    color:var(--g0);
}

.bf-btn{
    padding:11px;
    background:linear-gradient(
        135deg,
        #6366f1,
        #0ea5e9
    );
    color:#fff;
    border:none;
    font-family:var(--sans);
    font-size:9px;
    font-weight:500;
    letter-spacing:.2em;
    text-transform:uppercase;
    cursor:none;
    border-radius:7px;
    transition:opacity .25s;
}

.bf-btn:hover{
    opacity:.88;
}

.bf-btn:disabled{
    opacity:.35;
}

.bf-err{
    font-size:11px;
    color:#f87171;
    display:none;
}

.ip{
    display:none;
    border-top:1px solid rgba(189,179,168,.06);
}

.ip.on{
    display:block;
}

.ip-in{
    max-width:680px;
    margin:0 auto;
    padding:6px 20px;
    display:flex;
    align-items:center;
    gap:9px;
}

.ip-th{
    width:40px;
    height:40px;
    object-fit:cover;
    border-radius:5px;
    flex-shrink:0;
}

.ip-nm{
    font-size:11px;
    color:var(--g2);
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.ip-rm{
    background:none;
    border:none;
    color:var(--g1);
    cursor:none;
    font-size:16px;
    padding:2px 6px;
}

.ib-out{
    flex-shrink:0;
    padding:8px 20px 14px;
}

.ib-in{
    max-width:680px;
    margin:0 auto;
}

.ib-box{
    display:flex;
    align-items:flex-end;
    gap:6px;
    background:var(--c1);
    border:1px solid rgba(189,179,168,.12);
    border-radius:14px;
    padding:6px 6px 6px 12px;
    transition:border-color .25s;
}

.ib-box:focus-within{
    border-color:rgba(99,102,241,.35);
}

.ib-ic{
    width:30px;
    height:30px;
    border-radius:50%;
    background:none;
    border:none;
    color:var(--g1);
    cursor:none;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:color .2s;
}

.ib-ic:hover{
    color:var(--p1);
}

.ib-ta{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--p1);
    font-family:var(--sans);
    font-size:13.5px;
    font-weight:300;
    resize:none;
    line-height:1.5;
    min-height:20px;
    max-height:120px;
    overflow-y:auto;
    padding:4px 0;
    caret-color:#6366f1;
}

.ib-ta::placeholder{
    color:var(--g0);
}

.ib-ta:disabled{
    opacity:.45;
}

.ib-up{
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(189,179,168,.08);
    border:none;
    color:var(--g1);
    cursor:none;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:all .2s;
}

.ib-up.on{
    background:linear-gradient(
        135deg,
        #6366f1,
        #0ea5e9
    );
    color:#fff;
}

.ib-hint{
    font-size:9px;
    color:var(--g0);
    text-align:center;
    margin-top:5px;
    min-height:12px;
}

@media(max-width:600px){
    .cm-in{
        padding:12px 12px 6px;
    }

    .ib-out{
        padding:6px 12px 12px;
    }

    .bf-card{
        margin-left:0;
    }
}

<script>

var RAIL =
    'https://goodereseh-website-production.up.railway.app';


var SYS = `
You are the Good Ereseh Commission Assistant.

You help customers create a clear commission brief for Good Ereseh, a London-based charcoal and graphite artist.

Be warm, concise, intelligent and professional.

Never pretend to be Good Ereseh.

Never regenerate customer photographs.

Treat uploaded photographs only as reference images.

Analyse uploaded references for pose, lighting, facial detail, clothing, composition, background and suitability for charcoal and graphite artwork.

Refer to uploaded photographs as Reference 1, Reference 2, Reference 3 and so on.

If several references are uploaded, help the customer explain how they should be used.

Do not repeatedly ask the same question.

Ask one or two useful questions at a time.

Available commission types include:

A) Personal Portrait
B) Family Artwork
C) Couple Portrait
D) Memorial Piece
E) Conceptual Artwork
F) Gift Commission
G) Cultural or Legacy Piece
H) Other

Available sizes include:

A4
A3
A2
A1
Large Custom

Default medium is charcoal and graphite on archival cotton paper.

Never invent prices.

Never ask about framing.

Never recommend framing.

Do not ask for payment during the conversation.

The process is:

1. Develop the commission brief
2. Customer submits contact details and references
3. Good Ereseh reviews the request
4. A concept may be prepared
5. Customer approves
6. Good Ereseh confirms the quotation
7. Customer receives a private payment link

Never claim a commission has been accepted before Good Ereseh reviews it.

Never claim payment succeeded unless payment confirmation exists.

When the customer has given enough information, write:

COLLECT_DETAILS

on its own line.

Never generate customer artwork.

Never write GENERATE_CONCEPT.
`;


var chatHistory = [];

var references = [];

var pendingRef = null;

var collecting = false;

var recog = null;

var recOn = false;

var finalBrief = '';


var cmIn =
    document.getElementById(
        'cmIn'
    );

var cmOut =
    document.getElementById(
        'cmOut'
    );

var ibTa =
    document.getElementById(
        'ibTa'
    );

var ibUp =
    document.getElementById(
        'ibUp'
    );

var hint =
    document.getElementById(
        'ibHint'
    );


function wait(ms){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                ms
            );

        }
    );

}


function sb(){

    setTimeout(
        function(){

            cmOut.scrollTop =
                cmOut.scrollHeight;

        },
        60
    );

}


function esc(value){

    return value

        ? String(value)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;')

        : '';

}


function cur(el){

    el.querySelectorAll(
        'button,input,textarea,select'
    )
    .forEach(
        function(item){

            item.addEventListener(
                'mouseenter',
                function(){

                    document.body
                        .classList
                        .add(
                            'cursor-hover'
                        );

                }
            );


            item.addEventListener(
                'mouseleave',
                function(){

                    document.body
                        .classList
                        .remove(
                            'cursor-hover'
                        );

                }
            );

        }
    );

}


function addAI(html){

    var div =
        document.createElement(
            'div'
        );

    div.className =
        'msg ai';


    div.innerHTML =

        '<div class="mav">G</div>' +

        '<div class="bbl">' +

        html +

        '</div>';


    cmIn.appendChild(
        div
    );

    sb();

    cur(div);

    return div;

}


function addUser(
    text,
    imageUrl,
    label
){

    var div =
        document.createElement(
            'div'
        );

    div.className =
        'msg u';


    var image = '';


    if(imageUrl){

        image =

            '<div class="ref-thumb">' +

                '<div style="font-size:10px;color:var(--g1);margin-bottom:5px;">' +

                esc(
                    label ||
                    'Reference'
                ) +

                '</div>' +

                '<img src="' +
                imageUrl +
                '" alt="">' +

            '</div>';

    }


    div.innerHTML =

        '<div class="bbl">' +

        image +

        (
            text

                ? '<p>' +
                  esc(text) +
                  '</p>'

                : ''
        ) +

        '</div>';


    cmIn.appendChild(
        div
    );

    sb();

}


async function aiTyping(ms){

    var typing =
        document.createElement(
            'div'
        );


    typing.className =
        'msg ai';


    typing.innerHTML =

        '<div class="mav">G</div>' +

        '<div class="bbl">' +

            '<div class="ty">' +

                '<span></span>' +

                '<span></span>' +

                '<span></span>' +

            '</div>' +

        '</div>';


    cmIn.appendChild(
        typing
    );


    sb();


    await wait(
        ms ||
        700
    );


    typing.remove();

}


function renderAI(text){

    var lines =
        String(
            text ||
            ''
        )
        .split('\n');


    var html =
        '';

    var inParagraph =
        false;


    lines.forEach(
        function(line){

            var option =
                line.match(
                    /^([A-H])\)\s+(.+)$/
                );


            if(option){

                if(inParagraph){

                    html +=
                        '</p>';

                    inParagraph =
                        false;

                }


                html +=

                    '<button class="opt-btn"' +

                    ' data-full="' +

                    esc(
                        option[1] +
                        ') ' +
                        option[2]
                    ) +

                    '"' +

                    ' onclick="pickOpt(this)">' +

                    '<span class="ol">' +

                    option[1] +

                    '</span>' +

                    esc(
                        option[2]
                    ) +

                    '</button>';


                return;

            }


            var cleaned =
                line.trim();


            if(
                cleaned ===
                'COLLECT_DETAILS'
            ){

                return;

            }


            if(cleaned){

                if(!inParagraph){

                    html +=
                        '<p>';

                    inParagraph =
                        true;

                }
                else{

                    html +=
                        ' ';

                }


                html +=
                    esc(cleaned);

            }
            else if(
                inParagraph
            ){

                html +=
                    '</p>';

                inParagraph =
                    false;

            }

        }
    );


    if(inParagraph){

        html +=
            '</p>';

    }


    return html;

}


async function callAI(
    userText,
    refObj,
    displayText
){

    var content =
        [];


    if(
        refObj &&
        refObj.b64 &&
        refObj.type
    ){

        content.push({

            type:
                'image',

            source:{

                type:
                    'base64',

                media_type:
                    refObj.type,

                data:
                    refObj.b64

            }

        });

    }


    if(userText){

        content.push({

            type:
                'text',

            text:
                userText

        });

    }


    if(
        !content.length
    ){

        return null;

    }


    chatHistory.push({

        role:
            'user',

        content:

            content.length === 1 &&
            content[0].type ===
            'text'

                ? userText

                : content,

        displayText:

            displayText !==
            undefined

                ? displayText

                : userText

    });


    try{

        var response =
            await fetch(

                RAIL +
                '/chat',

                {

                    method:
                        'POST',

                    headers:{

                        'Content-Type':
                            'application/json'

                    },

                    body:
                        JSON.stringify({

                            system:
                                SYS,

                            messages:
                                chatHistory

                        })

                }

            );


        var data =
            await response.json();


        if(
            !response.ok
        ){

            throw new Error(

                data.error ||
                'Unable to reach the studio assistant.'

            );

        }


        chatHistory.push({

            role:
                'assistant',

            content:
                data.text,

            displayText:
                data.text

        });


        return data.text;

    }
    catch(error){

        console.error(
            'callAI error:',
            error.message
        );


        return (
            'The studio assistant is temporarily unavailable. Please wait a moment and try again.'
        );

    }

}


async function processAI(text){

    if(
        !text ||
        !String(text).trim()
    ){

        addAI(
            renderAI(
                'I did not quite catch that. Could you please try again?'
            )
        );

        return;

    }


    if(
        text.includes(
            'COLLECT_DETAILS'
        )
    ){

        var clean =
            text
                .replace(
                    'COLLECT_DETAILS',
                    ''
                )
                .trim();


        finalBrief =
            clean;


        disableAllOptions();


        if(clean){

            addAI(
                renderAI(
                    clean
                )
            );

        }


        await wait(
            250
        );


        showBriefForm();

        return;

    }


    addAI(
        renderAI(
            text
        )
    );

}


function disableAllOptions(){

    document
        .querySelectorAll(
            '.opt-btn'
        )
        .forEach(
            function(button){

                button.disabled =
                    true;

            }
        );

}


function wantsDetailsForm(text){

    var value =
        String(
            text ||
            ''
        )
        .toLowerCase();


    return (

        /fill\s+(the\s+)?form/.test(value) ||

        /complete\s+(the\s+)?form/.test(value) ||

        /submit\s+(my\s+)?commission/.test(value) ||

        /ready\s+to\s+submit/.test(value) ||

        /that\s+is\s+all/.test(value) ||

        /that's\s+all/.test(value)

    );

}

function doSend(){

    if(
        collecting
    ){

        return;

    }


    var text =
        ibTa.value.trim();


    if(
        !text &&
        !pendingRef
    ){

        return;

    }


    var ref =
        pendingRef;


    var refLabel =

        ref

            ? ref.label

            : null;


    var preview =

        ref

            ? ref.preview

            : null;


    ibTa.value =
        '';


    ibTa.style.height =
        'auto';


    if(ref){

        clearPendingRef(
            false
        );

    }


    refreshSend();


    addUser(
        text,
        preview,
        refLabel
    );


    disableInput();


    var aiText =
        text;


    var displayText =
        text;


    if(ref){

        var refCount =
            references.length;


        var context =

            'The customer has uploaded ' +

            refLabel +

            '. This is an original reference photograph. ' +

            'Do not regenerate or replace it. ' +

            'Analyse it only for the commission. ';


        if(
            refCount >
            1
        ){

            context +=

                'There are now ' +

                refCount +

                ' reference photographs. ' +

                'Ask how this new reference should be used in relation to the earlier references. ';

        }


        aiText =

            context +

            (
                text

                    ? 'Customer message: ' +
                      text

                    : 'Ask how they would like this reference used.'
            );


        displayText =

            text ||

            (
                'Uploaded ' +
                refLabel
            );

    }


    if(
        !ref &&
        wantsDetailsForm(
            text
        )
    ){

        aiText =

            'The customer is ready to submit. ' +

            'Create a concise final commission brief based only on the conversation. ' +

            'Include artwork type, subjects, reference images, size, composition, background and special instructions. ' +

            'Do not invent anything. ' +

            'Do not mention framing. ' +

            'Then write COLLECT_DETAILS on its own line.';

    }


    sendToAI(
        aiText,
        ref,
        displayText
    );

}


async function sendToAI(
    text,
    refObj,
    displayText
){

    if(
        collecting
    ){

        return;

    }


    await aiTyping(
        700
    );


    var aiText =
        await callAI(
            text,
            refObj,
            displayText
        );


    await processAI(
        aiText
    );


    if(
        !collecting
    ){

        enableInput();

    }

}

function onFile(input){

    var file =
        input.files[0];


    if(
        !file
    ){

        return;

    }


    if(
        references.length >=
        6
    ){

        addAI(
            '<p>You can attach up to 6 reference photographs to one commission request.</p>'
        );


        input.value =
            '';


        return;

    }


    var canvas =
        document.createElement(
            'canvas'
        );


    var ctx =
        canvas.getContext(
            '2d'
        );


    var image =
        new Image();


    image.onload =
        function(){

            var width =
                image.width;


            var height =
                image.height;


            var max =
                1200;


            if(
                width >
                max
            ){

                height =
                    Math.round(
                        height *
                        max /
                        width
                    );


                width =
                    max;

            }


            if(
                height >
                max
            ){

                width =
                    Math.round(
                        width *
                        max /
                        height
                    );


                height =
                    max;

            }


            canvas.width =
                width;


            canvas.height =
                height;


            ctx.drawImage(
                image,
                0,
                0,
                width,
                height
            );


            var dataUrl =
                canvas.toDataURL(
                    'image/jpeg',
                    0.82
                );


            var ref ={

                id:
                    'ref_' +
                    Date.now(),

                label:
                    'Reference ' +
                    (
                        references.length +
                        1
                    ),

                name:
                    file.name,

                b64:
                    dataUrl
                        .split(',')[1],

                type:
                    'image/jpeg',

                preview:
                    dataUrl

            };


            references.push(
                ref
            );


            pendingRef =
                ref;


            updatePendingStrip();


            refreshSend();


            input.value =
                '';

        };


    image.src =
        URL.createObjectURL(
            file
        );

}

function clearPendingRef(

){

function buildConversationSummary(){

    return chatHistory

        .map(
            function(message){

                var speaker =

                    message.role ===
                    'assistant'

                        ? 'Assistant'

                        : 'Customer';


                var text =

                    message.displayText !==
                    undefined

                        ? message.displayText

                        : (
                            typeof message.content ===
                            'string'

                                ? message.content

                                : ''
                        );


                text =
                    String(
                        text ||
                        ''
                    )
                    .replace(
                        /COLLECT_DETAILS/g,
                        ''
                    )
                    .trim();


                if(
                    !text
                ){

                    return '';

                }


                return (

                    speaker +

                    ': ' +

                    text

                );

            }
        )

        .filter(Boolean)

        .join(
            '\n\n'
        );

}


function buildConversationPayload(){

    return chatHistory

        .map(
            function(message){

                var text =

                    message.displayText !==
                    undefined

                        ? message.displayText

                        : (
                            typeof message.content ===
                            'string'

                                ? message.content

                                : ''
                        );


                text =
                    String(
                        text ||
                        ''
                    )
                    .replace(
                        /COLLECT_DETAILS/g,
                        ''
                    )
                    .trim();


                if(
                    !text
                ){

                    return null;

                }


                return {

                    role:

                        message.role ===
                        'assistant'

                            ? 'assistant'

                            : 'user',

                    text:
                        text

                };

            }
        )

        .filter(Boolean);

}

async function submitBrief(){

    var name =
        document
            .getElementById(
                'bfN'

            .value
            .trim();


    var email =
        document
            .getElementById(
                'bfE'
            )

    var phone =
        document
            .getElementById(
                'bfP'
            )
            .value

    var address1 =
        document
            .getElementById(
                'bfA1'
            )
            .value
            .trim();


    var address2 =
        document
            .getElementById(
                'bfA2'
            )
            .value
            .trim();


    var city =
        document
            .getElementById(
                'bfCity'
            )
            .value
            .trim();


    var county =
        document
            .getElementById(
                'bfCounty'
            )
            .value
            .trim();


    var postcode =
        document
            .getElementById(
                'bfPost'
            )
            .value
            .trim();


    var country =
        document
            .getElementById(
                'bfCountry'
            )
            .value
            .trim();


    var notes =
        document
            .getElementById(
                'bfNotes'
            )
            .value
            .trim();


    var consent =
        document
            .getElementById(
                'bfConsent'
            )
            .checked;


    var legalConsent =
        document
            .getElementById(
                'bfLegal'
            )
            .checked;


    var errorBox =
        document
            .getElementById(
                'bfErr'
            );


    var button =
        document
            .querySelector(
                '.bf-btn'
            );


    if(
        !name ||
        !email ||
        !phone ||
        !address1 ||
        !city ||
        !postcode ||
        !country
    ){

        errorBox.textContent =
            'Please complete your contact and delivery details.';


        errorBox.style.display =
            'block';


        return;

    }


    if(
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(
                email
            )
    ){

        errorBox.textContent =
            'Please enter a valid email address.';


        errorBox.style.display =
            'block';


        return;

    }


    if(
        references.length &&
        !consent
    ){

        errorBox.textContent =
            'Please confirm the reference-photo permission statement.';


        errorBox.style.display =
            'block';


        return;

    }


    if(
        !legalConsent
    ){

        errorBox.textContent =
            'Please agree to the Commission Terms and acknowledge the Privacy and AI policies.';


        errorBox.style.display =
            'block';


        return;

    }


    var summary =

        finalBrief ||

        buildConversationSummary();


    var conversationPayload =
        buildConversationPayload();


    var referencePayload =

        references.map(
            function(ref){

                return {

                    label:
                        ref.label,

                    name:
                        ref.name,

                    imageB64:
                        ref.b64,

                    imageType:
                        ref.type

                };

            }
        );


    button.textContent =
        'Submitting';


    button.disabled =
        true;


    errorBox.style.display =
        'none';


    try{

        var response =
            await fetch(

                RAIL +
                '/commission',

                {

                    method:
                        'POST',

                    headers:{

                        'Content-Type':
                            'application/json'

                    },

                    body:
                        JSON.stringify({

                            name:
                                name,

                            email:
                                email,

                            phone:
                                phone,

                            'commission-type':
                                'AI Guided Commission',

                            size:
                                '',

                            message:
                                summary,

                            conversation:
                                conversationPayload,

                            references:
                                referencePayload,

                            address:{

                                line1:
                                    address1,

                                line2:
                                    address2,

                                city:
                                    city,

                                county:
                                    county,

                                postcode:
                                    postcode,

                                country:
                                    country

                            },

                            notes:
                                notes,

                            referenceConsent:

                                references.length

                                    ? consent

                                    : true,

                            legalConsent:
                                legalConsent

                        })

                }

            );


        var data =
            await response.json();


        if(
            !response.ok
        ){

            throw new Error(

                data.error ||

                'Unable to submit commission request.'

            );

        }


        document
            .getElementById(
                'bfCard'
            )
            .style
            .display =
                'none';


        var wrap =
            document.getElementById(
                'payWrap'
            );


        wrap.style.display =
            'block';


        wrap.innerHTML =

            '<div class="bf-card" style="max-width:430px;">' +

                '<div style="font-family:var(--serif);font-size:19px;color:var(--p2);">' +

                    'Commission request received.' +

                '</div>' +

                '<p style="font-size:12px;color:var(--g2);line-height:1.75;margin-top:8px;">' +

                    (
                        data.commissionNumber

                            ? (
                                'Reference: <strong>' +

                                esc(
                                    data.commissionNumber
                                ) +

                                '</strong><br><br>'
                            )

                            : ''
                    ) +

                    'Good Ereseh will review your brief and reference photographs. ' +

                    'Your quotation and private payment link will follow after review.' +

                '</p>' +

            '</div>';


        sb();

    }
    catch(error){

        errorBox.textContent =

            error.message ||

            'Error. Email art@goodereseh.com';


        errorBox.style.display =
            'block';


        button.textContent =
            'Submit Commission Request →';


        button.disabled =
            false;

    }

}


function toggleMic(){

    var SpeechRecognition =

        window.SpeechRecognition ||

        window.webkitSpeechRecognition;


    var micButton =
        document.getElementById(
            'micBtn'
        );


    if(
        !SpeechRecognition
    ){

        addAI(
            '<p>Voice input is not supported in this browser. Please type your message instead.</p>'
        );

        return;

    }


    if(
        recOn
    ){

        if(
            recog
        ){

            recog.stop();

        }


        recOn =
            false;


        return;

    }


    recog =
        new SpeechRecognition();


    recog.lang =
        'en-GB';


    recog.continuous =
        false;


    recog.interimResults =
        true;


    recog.onstart =
        function(){

            recOn =
                true;

        };


    recog.onresult =
        function(event){

            var text =

                Array.from(
                    event.results
                )

                .map(
                    function(result){

                        return (
                            result[0]
                                .transcript
                        );

                    }
                )

                .join('');


            ibTa.value =
                text;


            refreshSend();

        };


    recog.onend =
        function(){

            recOn =
                false;

        };


    recog.onerror =
        function(){

            recOn =
                false;

        };


    recog.start();

}
