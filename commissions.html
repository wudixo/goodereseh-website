<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commissions &mdash; Good Ereseh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/v3.css">
<style>
html,body{height:100%;overflow:hidden;}
.c-page{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ink);}

/* NAV */
#nav{position:relative;flex-shrink:0;}

/* HEADER */
.c-head{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 20px;
  border-bottom:1px solid rgba(189,179,168,.07);background:var(--ink);}
.c-av{width:34px;height:34px;border-radius:50%;background:var(--c2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:12px;color:var(--g3);
  position:relative;flex-shrink:0;}
.c-av::after{content:"";position:absolute;inset:-2px;border-radius:50%;
  background:conic-gradient(from 0deg,#6366f1,#0ea5e9,#06b6d4,#7c3aed,#6366f1);
  animation:spin 5s linear infinite;z-index:-1;filter:blur(3px);opacity:.65;}
@keyframes spin{to{transform:rotate(360deg);}}
.c-head-info{flex:1;}
.c-head-name{font-family:var(--serif);font-size:15px;font-weight:300;color:var(--p2);line-height:1;}
.c-head-sub{font-size:9px;color:var(--g1);letter-spacing:.1em;margin-top:2px;}
.c-head-dot{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--g1);}
.c-head-dot span{width:6px;height:6px;border-radius:50%;background:#10b981;display:block;animation:glow 2s ease infinite;}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4);}50%{box-shadow:0 0 0 4px rgba(16,185,129,0);}}

/* MESSAGES */
.c-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;}
.c-msgs::-webkit-scrollbar{width:3px;}
.c-msgs::-webkit-scrollbar-thumb{background:var(--g0);border-radius:2px;}

.msg{display:flex;gap:10px;align-items:flex-start;animation:msgIn .35s ease forwards;opacity:0;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg.user{flex-direction:row-reverse;}

.m-av{width:28px;height:28px;border-radius:50%;background:var(--c2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:10px;color:var(--g3);margin-top:2px;position:relative;}
.m-av::after{content:"";position:absolute;inset:-2px;border-radius:50%;
  background:conic-gradient(from 0deg,#6366f1,#0ea5e9,#6366f1);
  animation:spin 3s linear infinite;z-index:-1;filter:blur(2px);opacity:.4;}

.m-body{display:flex;flex-direction:column;gap:8px;max-width:74%;}
.bubble{padding:11px 15px;font-size:13.5px;line-height:1.7;border-radius:14px;color:var(--p1);}
.msg.ai .bubble{background:var(--c1);border:1px solid rgba(189,179,168,.07);border-top-left-radius:3px;}
.msg.user .bubble{background:rgba(99,102,241,.16);border:1px solid rgba(99,102,241,.2);border-top-right-radius:3px;margin-left:auto;}
.bubble p{margin:0;}.bubble p+p{margin-top:7px;}

/* Clickable options inside AI message */
.opt-btn{display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 13px;margin-top:5px;
  background:var(--c2);border:1px solid rgba(189,179,168,.1);
  color:var(--g2);font-family:var(--sans);font-size:13px;
  text-align:left;cursor:none;border-radius:8px;
  transition:border-color .2s,color .2s,background .2s;}
.opt-btn:hover{border-color:#6366f1;color:var(--p1);background:rgba(99,102,241,.06);}
.opt-letter{width:22px;height:22px;border-radius:50%;background:rgba(189,179,168,.1);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:500;color:var(--g3);flex-shrink:0;letter-spacing:0;}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:5px 2px;align-items:center;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--g1);
  animation:tdot 1.2s ease-in-out infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.35;}30%{transform:translateY(-5px);opacity:1;}}

/* Image in chat */
.chat-img{max-width:200px;border-radius:10px;overflow:hidden;margin-top:4px;}
.chat-img img{width:100%;display:block;}
.gen-img-wrap{max-width:240px;border-radius:10px;overflow:hidden;border:1px solid rgba(189,179,168,.1);margin-top:4px;}
.gen-img-wrap img{width:100%;display:block;filter:brightness(.92) contrast(1.1) grayscale(10%);}
.gen-img-note{padding:8px 12px;background:var(--c2);font-size:10px;color:var(--g1);line-height:1.6;}

/* Image preview above input */
.img-preview{display:none;padding:8px 16px;background:var(--c1);
  border-top:1px solid rgba(189,179,168,.07);}
.img-preview.show{display:flex;align-items:center;gap:10px;}
.img-preview img{width:48px;height:48px;object-fit:cover;border-radius:6px;}
.img-preview-name{font-size:11px;color:var(--g2);flex:1;}
.img-preview-rm{background:none;border:none;color:var(--g1);cursor:none;font-size:16px;padding:4px;}

/* INPUT BAR */
.c-input{flex-shrink:0;padding:10px 14px 16px;background:var(--ink);
  border-top:1px solid rgba(189,179,168,.07);}
.c-input-box{display:flex;align-items:flex-end;gap:8px;
  background:var(--c1);border:1px solid rgba(189,179,168,.1);
  border-radius:14px;padding:8px 8px 8px 12px;
  transition:border-color .25s;}
.c-input-box:focus-within{border-color:rgba(99,102,241,.4);}
.c-icon-btn{width:34px;height:34px;border-radius:50%;background:none;border:none;
  color:var(--g1);cursor:none;display:flex;align-items:center;justify-content:center;
  transition:color .2s,background .2s;flex-shrink:0;}
.c-icon-btn:hover{color:var(--p1);background:rgba(189,179,168,.06);}
.c-icon-btn.active{color:#6366f1;}
.c-textarea{flex:1;background:none;border:none;outline:none;
  color:var(--p1);font-family:var(--sans);font-size:14px;font-weight:300;
  resize:none;line-height:1.5;min-height:22px;max-height:140px;
  overflow-y:auto;padding:6px 0;caret-color:#6366f1;}
.c-textarea::placeholder{color:var(--g0);}
.c-send{width:34px;height:34px;border-radius:50%;
  background:rgba(189,179,168,.1);border:none;
  color:var(--g1);cursor:none;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;}
.c-send.ready{background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;}
.c-send.ready:hover{opacity:.88;transform:scale(1.05);}

/* Voice recording pulse */
.c-icon-btn.recording{color:#ef4444;animation:recPulse 1s ease-in-out infinite;}
@keyframes recPulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* GENERATION OVERLAY */
.gen-ov{position:fixed;inset:0;background:rgba(15,13,11,.97);z-index:9999;
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:24px;}
.gen-ov.on{display:flex;}
.gen-fr{position:relative;width:200px;height:250px;background:var(--c2);border-radius:4px;overflow:hidden;}
.gen-fr::before{content:"";position:absolute;inset:0;z-index:1;
  background-image:linear-gradient(rgba(99,102,241,.04) 1px,transparent 1px),
  linear-gradient(90deg,rgba(99,102,241,.04) 1px,transparent 1px);
  background-size:14px 14px;}
.gen-scan{position:absolute;left:0;right:0;height:2px;z-index:3;
  background:linear-gradient(90deg,transparent,#6366f1,#0ea5e9,#6366f1,transparent);
  animation:gscan 1.5s ease-in-out infinite;box-shadow:0 0 14px rgba(99,102,241,.9);}
@keyframes gscan{0%{top:0;opacity:0;}5%{opacity:1;}95%{opacity:1;}100%{top:100%;opacity:0;}}
.gc{position:absolute;width:12px;height:12px;z-index:4;}
.gc.tl{top:6px;left:6px;border-top:1px solid #6366f1;border-left:1px solid #6366f1;}
.gc.tr{top:6px;right:6px;border-top:1px solid #6366f1;border-right:1px solid #6366f1;}
.gc.bl{bottom:6px;left:6px;border-bottom:1px solid #6366f1;border-left:1px solid #6366f1;}
.gc.br{bottom:6px;right:6px;border-bottom:1px solid #6366f1;border-right:1px solid #6366f1;}
.gen-noise{position:absolute;inset:0;z-index:2;background:var(--c2);transition:opacity 2s;}
.gen-pic{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 2s;}
.gen-bar-wrap{width:200px;height:1px;background:rgba(255,255,255,.06);}
.gen-bar-fill{height:100%;background:linear-gradient(90deg,#6366f1,#0ea5e9);width:0%;transition:width 1s ease;}
.gen-label{font-family:var(--serif);font-size:13px;color:var(--g3);letter-spacing:.1em;text-align:center;margin-bottom:8px;}
.gen-status{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--g1);text-align:center;transition:opacity .4s;}
.gen-ldots{display:flex;gap:5px;justify-content:center;margin-top:8px;}
.gen-ldots span{width:4px;height:4px;border-radius:50%;background:#6366f1;animation:tdot 1.2s ease-in-out infinite;}
.gen-ldots span:nth-child(2){animation-delay:.2s;}.gen-ldots span:nth-child(3){animation-delay:.4s;}

@media(max-width:600px){.c-msgs{padding:14px;}.c-input{padding:8px 10px 14px;}.m-body{max-width:85%;}}
</style>
</head>
<body>
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- Generation overlay -->
<div class="gen-ov" id="genOv">
  <div class="gen-fr">
    <div class="gc tl"></div><div class="gc tr"></div>
    <div class="gc bl"></div><div class="gc br"></div>
    <div class="gen-scan"></div>
    <div class="gen-noise" id="gNoise"></div>
    <img class="gen-pic" id="gPic" src="" alt="">
  </div>
  <div class="gen-bar-wrap"><div class="gen-bar-fill" id="gFill"></div></div>
  <div>
    <div class="gen-label">Good Ereseh &middot; Commission Assistant</div>
    <div class="gen-status" id="gStatus">Analysing your description</div>
    <div class="gen-ldots"><span></span><span></span><span></span></div>
  </div>
</div>

<div class="c-page">
  <nav id="nav">
    <a href="/" class="nav-mark"><span class="mark-g">G &middot; E</span><span class="mark-sub">Good Ereseh</span></a>
    <ul class="nav-links">
      <li><a href="/gallery">Gallery</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/commissions" class="active">Commissions</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/commissions" class="nav-commission">Commission</a></li>
    </ul>
  </nav>

  <div class="c-head">
    <div class="c-av">G</div>
    <div class="c-head-info">
      <div class="c-head-name">Commission Assistant</div>
      <div class="c-head-sub">Good Ereseh &middot; Charcoal &amp; Graphite &middot; London</div>
    </div>
    <div class="c-head-dot"><span></span>Online</div>
  </div>

  <div class="c-msgs" id="cMsgs"></div>

  <!-- Image preview strip -->
  <div class="img-preview" id="imgPreview">
    <img id="previewImg" src="" alt="">
    <span class="img-preview-name" id="previewName"></span>
    <button class="img-preview-rm" onclick="clearImage()" title="Remove">&#x2715;</button>
  </div>

  <!-- Input bar -->
  <div class="c-input">
    <div class="c-input-box">
      <!-- Image upload -->
      <button class="c-icon-btn" onclick="document.getElementById('fileIn').click()" title="Attach image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </button>
      <input type="file" id="fileIn" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">

      <!-- Text input -->
      <textarea class="c-textarea" id="cIn"
        placeholder="Describe your portrait, or type A / B / C to select an option&hellip;"
        rows="1"></textarea>

      <!-- Voice -->
      <button class="c-icon-btn" id="micBtn" onclick="toggleVoice()" title="Voice input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>

      <!-- Send (up arrow) -->
      <button class="c-send" id="cSend" onclick="handleSend()" disabled title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
var API_RAIL = 'https://goodereseh-website-production.up.railway.app';

/* ---- STATE ---- */
var history = [];
var uploadedB64 = null, uploadedType = null, uploadedName = '';
var recognition = null, isRecording = false;
var lastGenUrl = null;
var briefCollected = false;

/* ---- SYSTEM PROMPT ---- */
var SYSTEM = "You are the commission assistant for Good Ereseh, a hyperrealistic charcoal and graphite portrait artist based in London. You help customers commission a portrait through natural, friendly conversation.\n\nKEY RULES:\n1. When presenting options, ALWAYS format them EXACTLY like this (so they become clickable buttons):\nA) Option text here\nB) Option text here\nC) Option text here\n\n2. Users can type a letter (A/B/C/D) to select, or click the button, or type freely\n3. If a user says they made a mistake or wants to change something, re-present the relevant options\n4. Keep responses concise - 1-2 sentences then show options if needed\n5. Never say 'continue' - just naturally flow to the next question\n6. If user uploads an image, acknowledge it warmly and use what you can see to inform the brief\n\nCOMMISSION FLOW:\n1. Greet warmly (1-2 sentences). Ask what type of commission using options:\nA) Personal Portrait - capturing an individual from reference photos\nB) Family Artwork - multiple loved ones in one composition\nC) Memorial Piece - honouring someone's memory with care\n\n2. Ask who the portrait is of and any details (name, age, relationship to customer)\n\n3. Ask about mood/feeling using options (pick 5-6):\nA) Strength and dignity\nB) Warmth and tenderness\nC) Joy and playfulness\nD) Nostalgia and reflection\nE) Elegance and grace\nF) Mystery and depth\n\n4. Ask about size and investment:\nA) A4 Portrait - from £250 (210x297mm, ideal for intimate subjects)\nB) A3 Portrait - from £500 (297x420mm, most popular size)\nC) A2 Collector Piece - from £900 (420x594mm, prominent statement)\nD) Large Custom - from £1,500 (any size above A2)\n\n5. Ask for any final details or reference image description. If they uploaded an image, describe what you see and confirm it will be sent directly to Good Ereseh.\n\n6. When you have enough information, say you are ready to generate a concept. Then on a NEW LINE write exactly: GENERATE_CONCEPT\nThen on the next line write: PROMPT: followed by a detailed image generation prompt for a hyperrealistic charcoal portrait based on everything discussed.\n\n7. After the image is generated, ask if it captures what they had in mind. If not, ask what to change and adjust. Keep refining until they are happy.\n\n8. When customer is satisfied with the concept, say you will now collect their details to send the brief. Then write exactly: COLLECT_DETAILS\n\nIMPORTANT: The customer's reference photo (if uploaded) will be sent directly to Good Ereseh without any alteration. Mention this.\n\nProcess info (share when relevant):\n- 50% deposit required before work begins\n- Regular progress updates throughout\n- Final artwork delivered in a black presentation box with Certificate of Authenticity and wax seal\n- Good Ereseh responds within 2 business days";

/* ---- HELPERS ---- */
var cMsgs = document.getElementById('cMsgs');
var cIn   = document.getElementById('cIn');
var cSend = document.getElementById('cSend');

function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function sb(){ setTimeout(function(){ cMsgs.scrollTop = cMsgs.scrollHeight; },60); }

function ac(el){
  el.querySelectorAll('button,input,textarea').forEach(function(e){
    e.addEventListener('mouseenter',function(){document.body.classList.add('cursor-hover');});
    e.addEventListener('mouseleave',function(){document.body.classList.remove('cursor-hover');});
  });
}

/* ---- RENDER AI TEXT (parse options into buttons) ---- */
function renderAI(text){
  // Split into lines
  var lines = text.split('\n');
  var out = [];
  var inOptions = false;

  lines.forEach(function(line){
    var optMatch = line.match(/^([A-F])\)\s+(.+)$/);
    if(optMatch){
      inOptions = true;
      out.push('<button class="opt-btn" onclick="pickOpt(\'' + optMatch[1] + '\',this)">' +
        '<span class="opt-letter">' + optMatch[1] + '</span>' +
        optMatch[2] +
        '</button>');
    } else {
      if(line.trim() === 'GENERATE_CONCEPT' || line.trim().startsWith('PROMPT:') || line.trim() === 'COLLECT_DETAILS') return;
      if(line.trim()){
        out.push('<p>' + line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</p>');
      } else if(out.length && out[out.length-1] !== '<br>'){
        out.push('<br>');
      }
    }
  });
  return out.join('');
}

/* ---- ADD MESSAGES ---- */
function addAI(html){
  var d = document.createElement('div');
  d.className = 'msg ai';
  d.innerHTML = '<div class="m-av">G</div><div class="m-body"><div class="bubble">' + html + '</div></div>';
  cMsgs.appendChild(d);
  sb(); ac(d); return d;
}

function addUser(html, imgUrl){
  var imgHtml = imgUrl ? '<div class="chat-img"><img src="' + imgUrl + '" alt="Reference"></div>' : '';
  var d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = '<div class="m-body">' + imgHtml + '<div class="bubble"><p>' + html + '</p></div></div>';
  cMsgs.appendChild(d);
  sb(); return d;
}

function showTyping(){
  var d = document.createElement('div');
  d.className = 'msg ai';
  d.id = 'typing';
  d.innerHTML = '<div class="m-av">G</div><div class="m-body"><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>';
  cMsgs.appendChild(d); sb(); return d;
}

/* ---- OPTION CLICK ---- */
function pickOpt(letter, btn){
  // Grey out all sibling option buttons
  var body = btn.closest('.m-body');
  if(body) body.querySelectorAll('.opt-btn').forEach(function(b){ b.disabled=true; b.style.opacity='.45'; });
  // Get full option text
  var text = letter + ') ' + btn.textContent.trim();
  addUser(letter);
  sendToAI(letter, null, null);
}

/* ---- INPUT HANDLING ---- */
cIn.addEventListener('input', function(){
  cIn.style.height = 'auto';
  cIn.style.height = Math.min(cIn.scrollHeight, 140) + 'px';
  var hasText = cIn.value.trim().length > 0;
  cSend.disabled = !hasText;
  cSend.classList.toggle('ready', hasText);
});

cIn.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey && !cSend.disabled){
    e.preventDefault(); handleSend();
  }
});

function handleSend(){
  var text = cIn.value.trim();
  if(!text && !uploadedB64) return;
  var b64 = uploadedB64, type = uploadedType;
  var previewSrc = uploadedB64 ? 'data:' + uploadedType + ';base64,' + uploadedB64 : null;
  clearImage();
  cIn.value = ''; cIn.style.height = 'auto';
  cSend.disabled = true; cSend.classList.remove('ready');
  addUser(text || '(image attached)', previewSrc);
  sendToAI(text || 'I have uploaded a reference image.', b64, type);
}

/* ---- IMAGE UPLOAD ---- */
function handleFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var dataUrl = e.target.result;
    uploadedB64   = dataUrl.split(',')[1];
    uploadedType  = file.type;
    uploadedName  = file.name;
    var prev = document.getElementById('imgPreview');
    document.getElementById('previewImg').src = dataUrl;
    document.getElementById('previewName').textContent = file.name;
    prev.classList.add('show');
    // Enable send
    cSend.disabled = false; cSend.classList.add('ready');
  };
  reader.readAsDataURL(file);
}

function clearImage(){
  uploadedB64 = null; uploadedType = null; uploadedName = '';
  document.getElementById('imgPreview').classList.remove('show');
  document.getElementById('fileIn').value = '';
  if(!cIn.value.trim()){ cSend.disabled=true; cSend.classList.remove('ready'); }
}

/* ---- VOICE ---- */
function toggleVoice(){
  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRec){ addAI('<p>Voice input is not supported in this browser. Please try Chrome.</p>'); return; }
  var micBtn = document.getElementById('micBtn');
  if(isRecording){
    if(recognition) recognition.stop();
    isRecording = false; micBtn.classList.remove('recording'); return;
  }
  recognition = new SpeechRec();
  recognition.lang = 'en-GB'; recognition.continuous = false; recognition.interimResults = true;
  recognition.onstart = function(){ isRecording=true; micBtn.classList.add('recording'); };
  recognition.onresult = function(e){
    var t = Array.from(e.results).map(function(r){ return r[0].transcript; }).join('');
    cIn.value = t;
    cIn.style.height='auto'; cIn.style.height=Math.min(cIn.scrollHeight,140)+'px';
    cSend.disabled=false; cSend.classList.add('ready');
  };
  recognition.onend = function(){ isRecording=false; micBtn.classList.remove('recording'); };
  recognition.onerror = function(){ isRecording=false; micBtn.classList.remove('recording'); };
  recognition.start();
}

/* ---- CLAUDE API ---- */
async function sendToAI(userText, imgB64, imgType){
  // Build message content
  var content = [];
  if(imgB64 && imgType){
    content.push({ type:'image', source:{ type:'base64', media_type:imgType, data:imgB64 }});
  }
  if(userText) content.push({ type:'text', text:userText });
  if(content.length === 0) return;

  history.push({ role:'user', content: content.length===1 && content[0].type==='text' ? userText : content });

  var t = showTyping();
  cIn.disabled = true; cSend.disabled = true;

  try {
    var res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: SYSTEM,
        messages: history
      })
    });
    var data = await res.json();
    var aiText = data.content && data.content[0] ? data.content[0].text : 'Something went wrong. Please try again.';
    history.push({ role:'assistant', content: aiText });
    t.remove();

    // Check for special triggers
    if(aiText.includes('COLLECT_DETAILS')){
      var cleanText = aiText.replace('COLLECT_DETAILS','').trim();
      if(cleanText) addAI(renderAI(cleanText));
      showBriefForm();
    } else if(aiText.includes('GENERATE_CONCEPT')){
      var promptMatch = aiText.match(/PROMPT:\s*(.+)/s);
      var cleanText = aiText.split('GENERATE_CONCEPT')[0].trim();
      if(cleanText) addAI(renderAI(cleanText));
      if(promptMatch) await generateImage(promptMatch[1].trim());
    } else {
      addAI(renderAI(aiText));
    }
  } catch(err){
    t.remove();
    addAI('<p>Sorry, something went wrong. Please try again or email art@goodereseh.com.</p>');
  }

  cIn.disabled = false;
  setTimeout(function(){ cIn.focus(); },100);
}

/* ---- IMAGE GENERATION ---- */
async function generateImage(prompt){
  var overlay = document.getElementById('genOv');
  var status  = document.getElementById('gStatus');
  var fill    = document.getElementById('gFill');
  var pic     = document.getElementById('gPic');
  var noise   = document.getElementById('gNoise');

  pic.style.opacity='0'; noise.style.opacity='1'; fill.style.width='0%';
  overlay.classList.add('on');

  var phases=[
    {t:'Analysing your description',p:18},
    {t:'Composing portrait structure',p:42},
    {t:'Rendering charcoal textures',p:68},
    {t:'Finalising concept',p:94}
  ];

  var fullPrompt = 'hyperrealistic charcoal graphite portrait drawing, black and white fine art, ' +
    'heavy cotton paper texture, dramatic studio lighting, detailed eyes and skin, ' + prompt;
  var seed = Math.floor(Math.random()*99999);
  var imageUrl = 'https://image.pollinations.ai/prompt/' +
    encodeURIComponent(fullPrompt) + '?width=520&height=650&nologo=true&seed=' + seed;

  pic.src = imageUrl;
  lastGenUrl = imageUrl;

  for(var i=0;i<phases.length;i++){
    status.style.opacity='0'; await wait(200);
    status.textContent=phases[i].t; status.style.opacity='1';
    fill.style.width=phases[i].p+'%'; await wait(1100);
  }

  await new Promise(function(resolve){
    if(pic.complete&&pic.naturalWidth>0){resolve();return;}
    pic.onload=resolve; pic.onerror=resolve; setTimeout(resolve,30000);
  });

  status.textContent='Concept ready'; fill.style.width='100%';
  noise.style.opacity='0'; pic.style.opacity='1';
  await wait(2000);
  overlay.classList.remove('on');

  // Show image in chat
  var imgMsg = document.createElement('div');
  imgMsg.className = 'msg ai';
  imgMsg.style.animation = 'msgIn .4s ease forwards';
  imgMsg.style.opacity = '0';
  imgMsg.innerHTML = '<div class="m-av">G</div><div class="m-body">' +
    '<div class="gen-img-wrap">' +
      '<img src="' + imageUrl + '" alt="Portrait Concept">' +
      '<div class="gen-img-note">AI concept based on your description. The actual charcoal drawing will be far richer \u2014 built entirely by hand.</div>' +
    '</div></div>';
  cMsgs.appendChild(imgMsg);
  sb();

  // Ask AI to follow up
  history.push({ role:'user', content:'[System: The portrait concept image has been generated and shown to the customer. Please ask them what they think of it and whether it captures what they had in mind. If not, ask what they would like to change.]' });
  var t = showTyping();
  try{
    var res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:400,system:SYSTEM,messages:history})
    });
    var data = await res.json();
    var txt = data.content[0].text;
    history.push({role:'assistant',content:txt});
    t.remove(); addAI(renderAI(txt));
  } catch(e){ t.remove(); addAI('<p>What do you think of this concept? Does it capture what you had in mind?</p>'); }
}

  d.className = 'msg ai';
  d.innerHTML = '<div class="m-av">G</div><div class="m-body"><div class="bubble" style="padding:16px;">' +
    '<p style="margin-bottom:12px;font-size:13px;">Please enter your details to send your commission brief and receive your deposit invoice.</p>' +
    '<div style="display:flex;flex-direction:column;gap:8px;" id="briefFormInner">' +
      '<input type="text"  id="bfName"  placeholder="Full name"      style="background:var(--c2);border:1px solid rgba(189,179,168,.1);color:var(--p1);font-family:var(--sans);font-size:13px;padding:10px 13px;outline:none;border-radius:7px;width:100%;">' +
      '<input type="email" id="bfEmail" placeholder="Email address"  style="background:var(--c2);border:1px solid rgba(189,179,168,.1);color:var(--p1);font-family:var(--sans);font-size:13px;padding:10px 13px;outline:none;border-radius:7px;width:100%;">' +
      '<input type="tel"   id="bfPhone" placeholder="Phone number"   style="background:var(--c2);border:1px solid rgba(189,179,168,.1);color:var(--p1);font-family:var(--sans);font-size:13px;padding:10px 13px;outline:none;border-radius:7px;width:100%;">' +
      '<button onclick="submitBrief()" style="padding:12px;background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;border:none;font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:none;border-radius:7px;transition:opacity .25s;" id="submitBriefBtn">Send Brief &amp; Receive Deposit Invoice &#8250;</button>' +
      '<div id="briefErr" style="font-size:11px;color:#f87171;display:none;"></div>' +
    '</div>' +
    '<div id="briefDone" style="display:none;padding:14px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;font-size:13px;color:var(--p1);line-height:1.75;">' +
      '<strong style="font-family:var(--serif);font-size:16px;font-weight:300;color:var(--p2);">Brief received.</strong><br><br>' +
      'Good Ereseh will be in touch within two business days with your deposit invoice and start date.' +
    '</div>' +
  '</div></div>';
  cMsgs.appendChild(d);
  sb(); ac(d);
}

async function submitBrief(){
  var name  = document.getElementById('bfName').value.trim();
  var email = document.getElementById('bfEmail').value.trim();
  var phone = document.getElementById('bfPhone').value.trim();
  var errEl = document.getElementById('briefErr');
  var btn   = document.getElementById('submitBriefBtn');

  if(!name||!email){ errEl.textContent='Please enter name and email.'; errEl.style.display='block'; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ errEl.textContent='Invalid email.'; errEl.style.display='block'; return; }

  // Build brief from conversation
  var convSummary = history.filter(function(m){return m.role==='assistant';}).slice(-6)
    .map(function(m){ return typeof m.content==='string'?m.content:''; }).join('\n');

  var message = ['COMMISSION BRIEF VIA AI ASSISTANT','================================',
    'Name:  '+name,'Email: '+email,'Phone: '+(phone||'Not provided'),'',
    'CONVERSATION SUMMARY:',convSummary,'',
    (uploadedName ? 'NOTE: Customer uploaded a reference photo: '+uploadedName+'. Please request this file from them directly at art@goodereseh.com.' : ''),
    (lastGenUrl ? 'AI Concept generated: '+lastGenUrl : '')].join('\n');

  btn.textContent='Sending\u2026'; btn.disabled=true; errEl.style.display='none';

  try{
    var res = await fetch(API_RAIL+'/commission',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name,email:email,phone:phone,
        'commission-type':'AI Assistant Commission',size:'',message:message})
    });
    var data = await res.json();
    if(!res.ok) throw new Error(data.error||'Something went wrong.');
    document.getElementById('briefFormInner').style.display='none';
    document.getElementById('briefDone').style.display='block';
    sb();
  } catch(err){
    errEl.textContent=err.message||'Error. Please email art@goodereseh.com';
    errEl.style.display='block';
    btn.textContent='Send Brief & Receive Deposit Invoice \u203a'; btn.disabled=false;
  }
}

/* ---- NAV / CURSOR ---- */
var nav=document.getElementById('nav');
window.addEventListener('scroll',function(){nav.classList.toggle('scrolled',window.scrollY>60);},{passive:true});
var dot=document.getElementById('cursorDot'),ring=document.getElementById('cursorRing');
if(window.matchMedia('(pointer: fine)').matches){
  var mx=0,my=0,rx=0,ry=0,tt=0;
  document.addEventListener('mousemove',function(e){
    mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';
    clearTimeout(tt);tt=setTimeout(function(){
      var t=document.createElement('div');t.className='cursor-trail';
      t.style.left=mx+'px';t.style.top=my+'px';document.body.appendChild(t);
      t.addEventListener('animationend',function(){t.remove();});},16);
  });
  (function loop(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();
  document.querySelectorAll('a,button').forEach(function(el){
    el.addEventListener('mouseenter',function(){document.body.classList.add('cursor-hover');});
    el.addEventListener('mouseleave',function(){document.body.classList.remove('cursor-hover');});
  });
}
