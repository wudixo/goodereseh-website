<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commissions &mdash; Good Ereseh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/v3.css">
<style>
html,body{height:100%;overflow:hidden;}
.cp{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ink);}
#nav{position:relative;flex-shrink:0;z-index:10;}
.ch{flex-shrink:0;border-bottom:1px solid rgba(189,179,168,.07);}
.ch-in{max-width:680px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:11px;}
.av{width:32px;height:32px;border-radius:50%;background:var(--c2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:11px;color:var(--g3);position:relative;flex-shrink:0;}
.av::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 0deg,#6366f1,#0ea5e9,#06b6d4,#7c3aed,#6366f1);animation:sp 5s linear infinite;z-index:-1;filter:blur(3px);opacity:.55;}
@keyframes sp{to{transform:rotate(360deg);}}
.ch-name{font-family:var(--serif);font-size:14px;font-weight:300;color:var(--p2);}
.ch-sub{font-size:9px;color:var(--g1);letter-spacing:.08em;margin-top:1px;}
.ch-dot{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--g1);margin-left:auto;}
.ch-dot i{width:6px;height:6px;border-radius:50%;background:#10b981;display:block;}
.cm-out{flex:1;overflow-y:auto;}
.cm-out::-webkit-scrollbar{width:3px;}
.cm-out::-webkit-scrollbar-thumb{background:var(--g0);border-radius:2px;}
.cm-in{max-width:680px;margin:0 auto;padding:18px 20px 8px;display:flex;flex-direction:column;gap:12px;}
.msg{display:flex;gap:9px;align-items:flex-start;animation:mi .35s ease forwards;opacity:0;}
@keyframes mi{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg.u{flex-direction:row-reverse;}
.mav{width:27px;height:27px;border-radius:50%;background:var(--c2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:10px;color:var(--g3);flex-shrink:0;margin-top:2px;position:relative;}
.mav::after{content:"";position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 0deg,#6366f1,#0ea5e9,#6366f1);animation:sp 3s linear infinite;z-index:-1;filter:blur(2px);opacity:.35;}
.bbl{padding:10px 14px;font-size:13.5px;line-height:1.72;border-radius:14px;color:var(--p1);}
.msg.ai .bbl{background:var(--c1);border:1px solid rgba(189,179,168,.07);border-top-left-radius:3px;max-width:78%;}
.msg.u  .bbl{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.2);border-top-right-radius:3px;max-width:80%;margin-left:auto;}
.bbl p{margin:0;}.bbl p+p{margin-top:6px;}
.opt-btn{display:flex;align-items:center;gap:9px;padding:9px 13px;margin-top:5px;background:var(--c2);border:1px solid rgba(189,179,168,.1);color:var(--g2);font-family:var(--sans);font-size:13px;text-align:left;cursor:none;border-radius:9px;transition:border-color .2s,color .2s;width:100%;}
.opt-btn:hover:not(:disabled){border-color:#6366f1;color:var(--p1);}
.opt-btn:disabled{opacity:.45;pointer-events:none;}
.opt-btn.sel{border-color:#0ea5e9;color:var(--p1);}
.ol{width:21px;height:21px;border-radius:50%;background:rgba(189,179,168,.08);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--g3);flex-shrink:0;}
.ty{display:flex;gap:4px;padding:5px 2px;align-items:center;}
.ty span{width:6px;height:6px;border-radius:50%;background:var(--g1);animation:td 1.2s ease-in-out infinite;}
.ty span:nth-child(2){animation-delay:.2s;}.ty span:nth-child(3){animation-delay:.4s;}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.35;}30%{transform:translateY(-5px);opacity:1;}}
.ref-thumb{max-width:160px;border-radius:8px;overflow:hidden;margin-bottom:6px;}
.ref-thumb img{width:100%;display:block;}
.img-block{animation:mi .35s ease forwards;opacity:0;max-width:680px;}
.img-wrap{max-width:220px;border-radius:8px;overflow:hidden;border:1px solid rgba(189,179,168,.1);margin-left:36px;}
.img-wrap img{width:100%;display:block;}
.img-note{padding:7px 11px;background:var(--c2);font-size:10px;color:var(--g1);line-height:1.6;}
.bf-block{animation:mi .35s ease forwards;opacity:0;}
.bf-card{background:var(--c1);border:1px solid rgba(189,179,168,.08);border-radius:10px;padding:15px;max-width:320px;margin-left:36px;display:flex;flex-direction:column;gap:8px;}
.bf-inp{background:var(--c2);border:1px solid rgba(189,179,168,.1);color:var(--p1);font-family:var(--sans);font-size:13px;font-weight:300;padding:10px 13px;outline:none;border-radius:7px;transition:border-color .25s;}
.bf-inp:focus{border-color:#0ea5e9;}
.bf-inp::placeholder{color:var(--g0);}
.bf-btn{padding:11px;background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;border:none;font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:none;border-radius:7px;transition:opacity .25s;}
.bf-btn:hover{opacity:.88;}.bf-btn:disabled{opacity:.35;}
.bf-err{font-size:11px;color:#f87171;display:none;}
.pay-btn{display:block;text-align:center;padding:12px;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;border-radius:7px;text-decoration:none;margin-top:4px;border:none;cursor:none;width:100%;}
.ip{display:none;border-top:1px solid rgba(189,179,168,.06);}
.ip.on{display:block;}
.ip-in{max-width:680px;margin:0 auto;padding:6px 20px;display:flex;align-items:center;gap:9px;}
.ip-th{width:40px;height:40px;object-fit:cover;border-radius:5px;flex-shrink:0;}
.ip-nm{font-size:11px;color:var(--g2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ip-rm{background:none;border:none;color:var(--g1);cursor:none;font-size:16px;padding:2px 6px;}
.ib-out{flex-shrink:0;padding:8px 20px 14px;}
.ib-in{max-width:680px;margin:0 auto;}
.ib-box{display:flex;align-items:flex-end;gap:6px;background:var(--c1);border:1px solid rgba(189,179,168,.12);border-radius:14px;padding:6px 6px 6px 12px;transition:border-color .25s;}
.ib-box:focus-within{border-color:rgba(99,102,241,.35);}
.ib-ic{width:30px;height:30px;border-radius:50%;background:none;border:none;color:var(--g1);cursor:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .2s;}
.ib-ic:hover{color:var(--p1);}
.ib-ic.rc{color:#ef4444;animation:rp 1s ease-in-out infinite;}
@keyframes rp{0%,100%{opacity:1;}50%{opacity:.4;}}
.ib-ta{flex:1;background:none;border:none;outline:none;color:var(--p1);font-family:var(--sans);font-size:13.5px;font-weight:300;resize:none;line-height:1.5;min-height:20px;max-height:120px;overflow-y:auto;padding:4px 0;caret-color:#6366f1;}
.ib-ta::placeholder{color:var(--g0);}
.ib-ta:disabled{opacity:.45;}
.ib-up{width:30px;height:30px;border-radius:50%;background:rgba(189,179,168,.08);border:none;color:var(--g1);cursor:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.ib-up.on{background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;}
.ib-up.on:hover{opacity:.88;transform:scale(1.05);}
.ib-hint{font-size:9px;color:var(--g0);text-align:center;margin-top:5px;min-height:12px;}
.go{position:fixed;inset:0;background:rgba(15,13,11,.97);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;}
.go.on{display:flex;}
.gf{position:relative;width:190px;height:238px;background:var(--c2);border-radius:4px;overflow:hidden;}
.gf::before{content:"";position:absolute;inset:0;z-index:1;background-image:linear-gradient(rgba(99,102,241,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.04) 1px,transparent 1px);background-size:13px 13px;}
.gs{position:absolute;left:0;right:0;height:2px;z-index:3;background:linear-gradient(90deg,transparent,#6366f1,#0ea5e9,#6366f1,transparent);animation:gsc 1.5s ease-in-out infinite;box-shadow:0 0 13px rgba(99,102,241,.9);}
@keyframes gsc{0%{top:0;opacity:0;}5%{opacity:1;}95%{opacity:1;}100%{top:100%;opacity:0;}}
.gc{position:absolute;width:11px;height:11px;z-index:4;}
.gc.tl{top:6px;left:6px;border-top:1px solid #6366f1;border-left:1px solid #6366f1;}
.gc.tr{top:6px;right:6px;border-top:1px solid #6366f1;border-right:1px solid #6366f1;}
.gc.bl{bottom:6px;left:6px;border-bottom:1px solid #6366f1;border-left:1px solid #6366f1;}
.gc.br{bottom:6px;right:6px;border-bottom:1px solid #6366f1;border-right:1px solid #6366f1;}
.gn{position:absolute;inset:0;z-index:2;background:var(--c2);transition:opacity 2s;}
.gp{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 2s;}
.gb{width:190px;height:1px;background:rgba(255,255,255,.06);}
.gbf{height:100%;background:linear-gradient(90deg,#6366f1,#0ea5e9);width:0%;transition:width .9s ease;}
.gi{text-align:center;}
.gl{font-family:var(--serif);font-size:12px;color:var(--g3);letter-spacing:.1em;margin-bottom:7px;}
.gst{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--g1);transition:opacity .4s;}
.gd{display:flex;gap:5px;justify-content:center;margin-top:7px;}
.gd span{width:3px;height:3px;border-radius:50%;background:#6366f1;animation:td 1.2s ease-in-out infinite;}
.gd span:nth-child(2){animation-delay:.2s;}.gd span:nth-child(3){animation-delay:.4s;}
@media(max-width:600px){.cm-in{padding:12px 12px 6px;}.ib-out{padding:6px 12px 12px;}.bf-card,.img-wrap{margin-left:0;}}
</style>
</head>
<body>
<div class="cursor-dot" id="cDot"></div>
<div class="cursor-ring" id="cRing"></div>
<div class="go" id="genOv">
  <div class="gf"><div class="gc tl"></div><div class="gc tr"></div><div class="gc bl"></div><div class="gc br"></div><div class="gs"></div><div class="gn" id="gNoise"></div><img class="gp" id="gPic" src="" alt=""></div>
  <div class="gb"><div class="gbf" id="gFill"></div></div>
  <div class="gi"><div class="gl">Good Ereseh &middot; Commission Assistant</div><div class="gst" id="gStat">Analysing your description</div><div class="gd"><span></span><span></span><span></span></div></div>
</div>
<div class="cp">
  <nav id="nav">
    <a href="/" class="nav-mark"><span class="mark-g">G &middot; E</span><span class="mark-sub">Good Ereseh</span></a>
    <ul class="nav-links">
      <li><a href="/gallery">Gallery</a></li><li><a href="/about">About</a></li>
      <li><a href="/commissions" class="active">Commissions</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/commissions" class="nav-commission">Commission</a></li>
    </ul>
  </nav>
  <div class="ch"><div class="ch-in">
    <div class="av">G</div>
    <div><div class="ch-name">Commission Assistant</div><div class="ch-sub">Good Ereseh &middot; Powered by Google AI</div></div>
    <div class="ch-dot"><i></i>Online</div>
  </div></div>
  <div class="cm-out" id="cmOut"><div class="cm-in" id="cmIn"></div></div>
  <div class="ip" id="imgStrip">
    <div class="ip-in">
      <img class="ip-th" id="ipThumb" src="" alt="">
      <span class="ip-nm" id="ipName"></span>
      <button class="ip-rm" onclick="clearImg()">&#x2715;</button>
    </div>
  </div>
  <div class="ib-out"><div class="ib-in">
    <div class="ib-box">
      <button class="ib-ic" onclick="document.getElementById('fIn').click()" title="Attach reference photo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <input type="file" id="fIn" accept="image/*" style="display:none" onchange="onFile(this)">
      <textarea class="ib-ta" id="ibTa" rows="1" placeholder="Message\u2026"></textarea>
      <button class="ib-ic" id="micBtn" onclick="toggleMic()" title="Voice">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="ib-up" id="ibUp" onclick="doSend()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
    <div class="ib-hint" id="ibHint"></div>
  </div></div>
</div>
<script>
var RAIL = 'https://goodereseh-website-production.up.railway.app';
var SYS  = "You are the commission assistant for Good Ereseh, a hyperrealistic charcoal and graphite portrait artist in London.\n\nYou guide customers warmly through commissioning a portrait. Sound like a real, knowledgeable assistant.\n\nWhen presenting options always format them on separate lines like:\nA) Option text\nB) Option text\n\nThis creates clickable buttons. Keep responses concise \u2014 2-3 sentences then options.\n\nCommission types:\nA) Personal Portrait\nB) Family Artwork\nC) Memorial Piece\n\nSizes:\nA) A4 Portrait \u2014 from \u00a3250\nB) A3 Portrait \u2014 from \u00a3500\nC) A2 Collector Piece \u2014 from \u00a3900\nD) Large Custom \u2014 from \u00a31,500\n\nFlow: ask type \u2192 who is the portrait of \u2192 mood (offer 5-6 labelled options) \u2192 size \u2192 description or reference photo.\n\nWhen you have enough information write on its own line: GENERATE_CONCEPT\nNext line: PROMPT: [detailed charcoal portrait prompt]\n\nAfter concept shown, ask if it captures their vision. When satisfied write: COLLECT_DETAILS\n\nIf user uploads a reference photo, their original will be sent to Good Ereseh unaltered. Use your image analysis to improve the concept prompt.\n\nProcess: 50% deposit upfront, progress updates throughout, delivered in presentation box with Certificate of Authenticity. Turnaround 4-8 weeks.";

var history     = [];
var imgB64      = null, imgType = null, imgName = '';
var imgAnalysis = '';
var lastGenUrl  = null;
var collecting  = false;
var recog = null, recOn = false;

var cmIn  = document.getElementById('cmIn');
var cmOut = document.getElementById('cmOut');
var ibTa  = document.getElementById('ibTa');
var ibUp  = document.getElementById('ibUp');
var hint  = document.getElementById('ibHint');

function wait(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
function sb(){ setTimeout(function(){ cmOut.scrollTop=cmOut.scrollHeight; },60); }
function esc(s){ return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }
function cur(el){ el.querySelectorAll('button,input,textarea').forEach(function(e){
  e.addEventListener('mouseenter',function(){document.body.classList.add('cursor-hover');});
  e.addEventListener('mouseleave',function(){document.body.classList.remove('cursor-hover');});
}); }

function addAI(html){
  var d=document.createElement('div'); d.className='msg ai';
  d.innerHTML='<div class="mav">G</div><div class="bbl">'+html+'</div>';
  cmIn.appendChild(d); sb(); cur(d); return d;
}
function addUser(text, imgUrl){
  var d=document.createElement('div'); d.className='msg u';
  var img=imgUrl?'<div class="ref-thumb"><img src="'+imgUrl+'" alt="Ref"></div>':'';
  d.innerHTML='<div class="bbl">'+img+(text?'<p>'+esc(text)+'</p>':'')+'</div>';
  cmIn.appendChild(d); sb(); return d;
}
async function aiTyping(ms){
  var t=document.createElement('div'); t.className='msg ai';
  t.innerHTML='<div class="mav">G</div><div class="bbl"><div class="ty"><span></span><span></span><span></span></div></div>';
  cmIn.appendChild(t); sb();
  await wait(ms||900);
  t.remove();
}

function renderAI(text){
  var lines=text.split('\n');
  var html='', inP=false;
  lines.forEach(function(line){
    var m=line.match(/^([A-F])\)\s+(.+)$/);
    if(m){
      if(inP){html+='</p>';inP=false;}
      html+='<button class="opt-btn" data-letter="'+m[1]+'" data-full="'+esc(m[1]+') '+m[2])+'" onclick="pickOpt(this)"><span class="ol">'+m[1]+'</span>'+esc(m[2])+'</button>';
    } else {
      var s=line.trim();
      if(s==='GENERATE_CONCEPT'||s.startsWith('PROMPT:')||s==='COLLECT_DETAILS') return;
      if(s){if(!inP){html+='<p>';inP=true;}else{html+=' ';}html+=esc(s);}
      else{if(inP){html+='</p>';inP=false;}}
    }
  });
  if(inP)html+='</p>';
  return html;
}

async function callAI(userText, b64, type){
  var content=[];
  if(b64&&type) content.push({type:'image',source:{type:'base64',media_type:type,data:b64}});
  if(userText) content.push({type:'text',text:userText});
  if(!content.length) return null;

  history.push({ role:'user', content: content.length===1&&content[0].type==='text' ? userText : content });

  try{
    var res=await fetch(RAIL+'/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ system:SYS, messages:history })
    });
    var data=await res.json();
    if(!res.ok) throw new Error(data.error||'Error');
    history.push({role:'assistant',content:data.text});
    return data.text;
  }catch(err){
    console.error('callAI error:', err.message);
    return 'Sorry, something went wrong. Please try again or email art@goodereseh.com.';
  }
}

async function processAI(text){
  if(!text) return;
  if(text.includes('COLLECT_DETAILS')){
    var clean=text.replace('COLLECT_DETAILS','').trim();
    if(clean) addAI(renderAI(clean));
    await wait(300);
    showBriefForm();
    return;
  }
  if(text.includes('GENERATE_CONCEPT')){
    var pm=text.match(/PROMPT:\s*(.+)/s);
    var clean=text.split('GENERATE_CONCEPT')[0].trim();
    if(clean) addAI(renderAI(clean));
    if(pm){ await wait(300); await runGen(pm[1].trim()); }
    return;
  }
  addAI(renderAI(text));
}

function pickOpt(btn){
  if(btn.disabled||collecting) return;
  btn.closest('.bbl').querySelectorAll('.opt-btn').forEach(function(b){b.disabled=true;});
  btn.classList.add('sel');
  var full=btn.dataset.full||btn.textContent.trim();
  addUser(full);
  disableInput();
  sendToAI(full, null, null);
}

function doSend(){
  if(collecting) return;
  var text=ibTa.value.trim();
  var hasImg=!!imgB64;
  if(!text&&!hasImg) return;
  var b64=imgB64, type=imgType;
  var prev=b64?'data:'+type+';base64,'+b64:null;
  ibTa.value=''; ibTa.style.height='auto'; refreshSend();
  if(hasImg) clearImg();
  addUser(text, prev);
  disableInput();
  sendToAI(text||(hasImg?'I have attached a reference photo.':''), b64, type);
}

async function sendToAI(text, b64, type){
  if(collecting) return;
  await aiTyping(900);
  var aiText=await callAI(text, b64, type);
  await processAI(aiText);
  enableInput();
}

ibTa.addEventListener('input',function(){
  ibTa.style.height='auto';
  ibTa.style.height=Math.min(ibTa.scrollHeight,120)+'px';
  refreshSend();
});
ibTa.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey&&!ibUp.disabled){e.preventDefault();doSend();}
});
function refreshSend(){ var ok=ibTa.value.trim().length>0||!!imgB64; ibUp.disabled=!ok; ibUp.classList.toggle('on',ok); }
function enableInput(){ ibTa.disabled=false; hint.textContent=''; setTimeout(function(){ibTa.focus();},80); }
function disableInput(){ ibTa.disabled=true; ibUp.disabled=true; ibUp.classList.remove('on'); hint.textContent=''; }

function onFile(input){
  var file=input.files[0]; if(!file) return;
  var canvas=document.createElement('canvas'), ctx=canvas.getContext('2d'), img=new Image();
  img.onload=function(){
    var w=img.width, h=img.height;
    if(w>800){h=Math.round(h*800/w);w=800;}
    if(h>800){w=Math.round(w*800/h);h=800;}
    canvas.width=w; canvas.height=h; ctx.drawImage(img,0,0,w,h);
    var du=canvas.toDataURL('image/jpeg',0.78);
    imgB64=du.split(',')[1]; imgType='image/jpeg'; imgName=file.name;
    document.getElementById('ipThumb').src=du;
    document.getElementById('ipName').textContent=file.name;
    document.getElementById('imgStrip').classList.add('on');
    refreshSend();
    analyseImg(imgB64);
  };
  img.src=URL.createObjectURL(file);
}
function clearImg(){ imgB64=null; imgType=null; imgName=''; document.getElementById('imgStrip').classList.remove('on'); document.getElementById('fIn').value=''; refreshSend(); }

async function analyseImg(b64){
  try{
    var res=await fetch(RAIL+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:'Analyse this reference photo for a charcoal portrait commission. Describe the person\'s face shape, features, hair, expression, and lighting in 3-4 sentences. Be specific.',
        messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:'Analyse this reference photo.'}]}]})
    });
    if(res.ok){ var d=await res.json(); imgAnalysis=d.text||''; }
  }catch(e){}
}

async function runGen(basePrompt){
  var ov=document.getElementById('genOv'), st=document.getElementById('gStat'), fill=document.getElementById('gFill'), pic=document.getElementById('gPic'), noise=document.getElementById('gNoise');
  var prompt='hyperrealistic charcoal graphite portrait, '+(imgAnalysis?imgAnalysis+', ':'')+basePrompt+', black and white fine art, cotton paper, dramatic lighting, detailed eyes';
  var url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=520&height=650&nologo=true&seed='+Math.floor(Math.random()*99999);
  lastGenUrl=url;
  pic.style.opacity='0'; noise.style.opacity='1'; fill.style.width='0%';
  ov.classList.add('on'); pic.src=url;
  var phases=[{t:'Reading your reference',p:15},{t:'Composing portrait',p:42},{t:'Rendering textures',p:68},{t:'Finalising',p:94}];
  for(var i=0;i<phases.length;i++){
    st.style.opacity='0'; await wait(200);
    st.textContent=phases[i].t; st.style.opacity='1';
    fill.style.width=phases[i].p+'%'; await wait(1100);
  }
  await new Promise(function(r){ if(pic.complete&&pic.naturalWidth>0){r();return;} pic.onload=r; pic.onerror=r; setTimeout(r,30000); });
  st.textContent='Concept ready'; fill.style.width='100%';
  noise.style.opacity='0'; pic.style.opacity='1';
  await wait(2000); ov.classList.remove('on');
  var blk=document.createElement('div'); blk.className='img-block';
  blk.innerHTML='<div class="img-wrap"><img src="'+url+'" alt="Concept" onerror="this.style.display=\'none\'"><div class="img-note">AI concept based on your description. The actual charcoal artwork will be far richer.</div></div>';
  cmIn.appendChild(blk); sb();
  await wait(300);
  var followText=await callAI('[The concept image has been shown. Ask if it captures their vision. If not, what to change. When happy, write COLLECT_DETAILS]',null,null);
  await processAI(followText);
  enableInput();
}

function showBriefForm(){
  collecting=true;
  var blk=document.createElement('div'); blk.className='bf-block';
  blk.innerHTML='<div class="bf-card" id="bfCard"><input class="bf-inp" type="text" id="bfN" placeholder="Full name" autocomplete="name"><input class="bf-inp" type="email" id="bfE" placeholder="Email address" autocomplete="email"><input class="bf-inp" type="tel" id="bfP" placeholder="Phone number" autocomplete="tel"><button class="bf-btn" onclick="submitBrief()">Send Brief \u2192</button><div class="bf-err" id="bfErr"></div></div><div id="payWrap" style="display:none;"></div>';
  cmIn.appendChild(blk); sb(); cur(blk); disableInput();
}

async function submitBrief(){
  var name=document.getElementById('bfN').value.trim();
  var email=document.getElementById('bfE').value.trim();
  var phone=document.getElementById('bfP').value.trim();
  var err=document.getElementById('bfErr'), btn=document.querySelector('.bf-btn');
  if(!name||!email){err.textContent='Please enter name and email.';err.style.display='block';return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Invalid email.';err.style.display='block';return;}
  var summary=history.filter(function(m){return m.role==='assistant';}).slice(-5).map(function(m){return typeof m.content==='string'?m.content:'';}).join('\n');
  btn.textContent='Sending\u2026'; btn.disabled=true; err.style.display='none';
  try{
    var res=await fetch(RAIL+'/commission',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name,email:email,phone:phone,'commission-type':'AI Commission',size:'',message:summary,imageB64:imgB64||undefined,imageType:imgType||undefined,conceptUrl:lastGenUrl||undefined})
    });
    var data=await res.json();
    if(!res.ok) throw new Error(data.error||'Error');
    document.getElementById('bfCard').style.display='none';
    var pw=document.getElementById('payWrap'); pw.style.display='block';
    pw.innerHTML=data.paymentUrl
      ?'<p style="font-size:13px;color:var(--p1);line-height:1.7;margin-bottom:10px;">Brief received. Secure your commission slot with the \u00a350 booking deposit:</p><a href="'+data.paymentUrl+'" class="pay-btn" target="_blank">Pay \u00a350 Deposit \u2192 Stripe</a><p style="font-size:10px;color:var(--g1);margin-top:8px;">Good Ereseh will confirm your full quote within two business days.</p>'
      :'<p style="font-size:14px;color:var(--p2);font-family:var(--serif);font-weight:300;">Brief received.</p><p style="font-size:13px;color:var(--g2);margin-top:8px;line-height:1.75;">Good Ereseh will be in touch within two business days with your invoice.</p>';
    sb();
  }catch(e){
    err.textContent=e.message||'Error. Email art@goodereseh.com'; err.style.display='block';
    btn.textContent='Send Brief \u2192'; btn.disabled=false;
  }
}

function toggleMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var micBtn=document.getElementById('micBtn');
  if(!SR){addAI('<p>Voice input requires Chrome or iOS Safari.</p>');return;}
  if(recOn){if(recog)recog.stop();recOn=false;micBtn.classList.remove('rc');return;}
  recog=new SR(); recog.lang='en-GB'; recog.continuous=false; recog.interimResults=true;
  recog.onstart=function(){recOn=true;micBtn.classList.add('rc');};
  recog.onresult=function(e){var t=Array.from(e.results).map(function(r){return r[0].transcript;}).join('');ibTa.value=t;ibTa.style.height='auto';ibTa.style.height=Math.min(ibTa.scrollHeight,120)+'px';refreshSend();};
  recog.onend=function(){recOn=false;micBtn.classList.remove('rc');};
  recog.onerror=function(){recOn=false;micBtn.classList.remove('rc');};
  recog.start();
}

var navEl=document.getElementById('nav');
window.addEventListener('scroll',function(){navEl.classList.toggle('scrolled',window.scrollY>60);},{passive:true});
var cdot=document.getElementById('cDot'),cring=document.getElementById('cRing');
if(window.matchMedia('(pointer: fine)').matches){
  var mx=0,my=0,rx=0,ry=0,tt=0;
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;cdot.style.left=mx+'px';cdot.style.top=my+'px';clearTimeout(tt);tt=setTimeout(function(){var t=document.createElement('div');t.className='cursor-trail';t.style.left=mx+'px';t.style.top=my+'px';document.body.appendChild(t);t.addEventListener('animationend',function(){t.remove();});},16);});
  (function loop(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;cring.style.left=rx+'px';cring.style.top=ry+'px';requestAnimationFrame(loop);})();
  document.querySelectorAll('a,button').forEach(function(el){el.addEventListener('mouseenter',function(){document.body.classList.add('cursor-hover');});el.addEventListener('mouseleave',function(){document.body.classList.remove('cursor-hover');});});
}
