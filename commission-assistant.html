<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission Assistant — Good Ereseh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/v3.css">
<style>
.chat-page{min-height:100vh;background:var(--ink);display:flex;flex-direction:column;position:relative;}
.chat-page::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(79,70,229,.06) 0%,rgba(6,182,212,.03) 50%,transparent 70%);pointer-events:none;z-index:0;animation:ambientPulse 4s ease-in-out infinite;}
@keyframes ambientPulse{0%,100%{opacity:.6;transform:translateX(-50%) scale(1);}50%{opacity:1;transform:translateX(-50%) scale(1.08);}}
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto;padding:100px 24px 0;position:relative;z-index:1;}
.chat-header{text-align:center;padding:32px 0 40px;}
.chat-avatar-large{width:60px;height:60px;border-radius:50%;background:var(--c2);border:1px solid rgba(189,179,168,.1);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;font-weight:300;color:var(--g3);margin:0 auto 16px;position:relative;}
.chat-avatar-large::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,#4f46e5,#0ea5e9,#06b6d4,#7c3aed,#4f46e5);animation:spinGlow 4s linear infinite;z-index:-1;filter:blur(4px);opacity:.6;}
@keyframes spinGlow{to{transform:rotate(360deg);}}
.chat-header-title{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--p2);margin-bottom:6px;}
.chat-header-sub{font-size:11px;color:var(--g1);letter-spacing:.1em;}
.chat-messages{flex:1;display:flex;flex-direction:column;gap:20px;padding-bottom:220px;min-height:300px;}
.msg{display:flex;gap:12px;align-items:flex-end;animation:msgIn .4s var(--ease) forwards;opacity:0;}
@keyframes msgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.msg.user{flex-direction:row-reverse;}
.msg-avatar{width:32px;height:32px;border-radius:50%;background:var(--c2);border:1px solid rgba(189,179,168,.1);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:11px;color:var(--g3);flex-shrink:0;position:relative;}
.msg-avatar::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(from 0deg,#4f46e5,#0ea5e9,#4f46e5);animation:spinGlow 3s linear infinite;z-index:-1;filter:blur(3px);opacity:.5;}
.msg.ai .msg-bubble{background:var(--c1);border:1px solid rgba(189,179,168,.07);border-bottom-left-radius:0;max-width:80%;}
.msg.user .msg-bubble{background:var(--c2);border:1px solid rgba(189,179,168,.1);border-bottom-right-radius:0;max-width:80%;margin-left:auto;}
.msg-bubble{padding:14px 18px;font-size:14px;color:var(--p1);line-height:1.7;border-radius:4px;}
.msg-bubble p+p{margin-top:8px;}
.typing-dots{display:flex;gap:5px;padding:6px 4px;align-items:center;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--g1);animation:typeDot 1.2s ease-in-out infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes typeDot{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}
.chat-input-area{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--ink) 70%,transparent);padding:24px;z-index:100;display:none;}
.chat-input-area.visible{display:block;}
.chat-input-inner{max-width:760px;margin:0 auto;}
.chat-text-row{display:flex;gap:10px;align-items:center;background:var(--c1);border:1px solid rgba(189,179,168,.12);padding:4px 4px 4px 18px;transition:border-color .3s;}
.chat-text-row:focus-within{border-color:rgba(79,70,229,.5);}
.chat-text-input{flex:1;background:none;border:none;outline:none;color:var(--p1);font-family:var(--sans);font-size:14px;font-weight:300;padding:10px 0;caret-color:#0ea5e9;}
.chat-text-input::placeholder{color:var(--g0);}
.chat-send-btn{padding:10px 20px;background:linear-gradient(90deg,#4f46e5,#0ea5e9);color:#fff;border:none;font-family:var(--sans);font-size:11px;font-weight:400;letter-spacing:.12em;cursor:none;transition:opacity .3s;}
.chat-send-btn:hover{opacity:.85;}
.chat-send-btn:disabled{opacity:.3;}
.chat-options{display:flex;flex-direction:column;gap:6px;}
.chat-opt{padding:13px 18px;background:var(--c1);border:1px solid rgba(189,179,168,.08);color:var(--g2);font-family:var(--sans);font-size:13px;text-align:left;cursor:none;transition:border-color .3s,color .3s,background .3s;}
.chat-opt:hover{border-color:rgba(79,70,229,.4);color:var(--p1);background:var(--c2);}
.chat-moods{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.mood-chip{padding:8px 16px;background:var(--c1);border:1px solid rgba(189,179,168,.08);color:var(--g2);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:none;transition:border-color .3s,color .3s,background .3s;font-family:var(--sans);}
.mood-chip.on{border-color:#0ea5e9;color:#0ea5e9;background:rgba(14,165,233,.06);}
.chat-mood-confirm{padding:11px 24px;background:linear-gradient(90deg,#4f46e5,#0ea5e9);color:#fff;border:none;font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:none;opacity:.4;transition:opacity .3s;}
.chat-mood-confirm.ready{opacity:1;}

/* Generation overlay */
.gen-overlay{position:fixed;inset:0;background:var(--ink);z-index:9000;align-items:center;justify-content:center;flex-direction:column;gap:40px;display:none;}
.gen-overlay.active{display:flex;}
.gen-canvas-wrap{position:relative;width:280px;height:350px;overflow:hidden;background:var(--c2);}
.gen-canvas-wrap::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(14,165,233,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,.04) 1px,transparent 1px);background-size:20px 20px;z-index:1;}
.gen-scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#0ea5e9,#7c3aed,#0ea5e9,transparent);z-index:3;animation:genScan 1.8s ease-in-out infinite;box-shadow:0 0 12px rgba(14,165,233,.8),0 0 24px rgba(124,58,237,.4);}
@keyframes genScan{0%{top:0;opacity:0;}5%{opacity:1;}95%{opacity:1;}100%{top:100%;opacity:0;}}
.gen-corner{position:absolute;width:18px;height:18px;z-index:4;}
.gen-corner.tl{top:8px;left:8px;border-top:1px solid #0ea5e9;border-left:1px solid #0ea5e9;}
.gen-corner.tr{top:8px;right:8px;border-top:1px solid #0ea5e9;border-right:1px solid #0ea5e9;}
.gen-corner.bl{bottom:8px;left:8px;border-bottom:1px solid #0ea5e9;border-left:1px solid #0ea5e9;}
.gen-corner.br{bottom:8px;right:8px;border-bottom:1px solid #0ea5e9;border-right:1px solid #0ea5e9;}
.gen-noise{position:absolute;inset:0;z-index:2;background:var(--c2);transition:opacity 1.5s ease;}
.gen-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1;opacity:0;transition:opacity 1.5s ease;filter:brightness(.9) contrast(1.1) grayscale(15%);}
.gen-status-wrap{text-align:center;}
.gen-title{font-family:var(--serif);font-size:13px;font-weight:300;color:var(--g3);letter-spacing:.1em;margin-bottom:12px;}
.gen-status-text{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--g1);transition:opacity .4s;}
.gen-dots{display:flex;gap:6px;justify-content:center;margin-top:12px;}
.gen-dots span{width:4px;height:4px;border-radius:50%;background:#0ea5e9;animation:typeDot 1.2s ease-in-out infinite;}
.gen-dots span:nth-child(2){animation-delay:.2s;}
.gen-dots span:nth-child(3){animation-delay:.4s;}
.gen-bar{width:280px;height:1px;background:var(--c3);overflow:hidden;}
.gen-bar-fill{height:100%;background:linear-gradient(90deg,#4f46e5,#0ea5e9,#06b6d4);width:0%;transition:width .8s var(--ease);}

/* Concept in chat */
.concept-in-chat{width:100%;max-width:320px;overflow:hidden;position:relative;}
.concept-in-chat img{width:100%;display:block;filter:brightness(.9) contrast(1.1) grayscale(15%);}
.concept-in-chat-note{padding:10px 14px;background:var(--c2);font-size:10px;color:var(--g1);line-height:1.6;border-top:1px solid rgba(189,179,168,.07);}
.brief-form-msg{background:var(--c1);border:1px solid rgba(189,179,168,.07);padding:20px;display:flex;flex-direction:column;gap:10px;max-width:80%;}
.brief-form-msg input{background:var(--c2);border:1px solid rgba(189,179,168,.08);color:var(--p1);font-family:var(--sans);font-size:13px;font-weight:300;padding:11px 14px;outline:none;transition:border-color .3s;width:100%;}
.brief-form-msg input:focus{border-color:rgba(79,70,229,.4);}
.brief-form-msg input::placeholder{color:var(--g0);}
.btn-send-brief{padding:12px;background:linear-gradient(90deg,#4f46e5,#0ea5e9);color:#fff;border:none;font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;cursor:none;transition:opacity .3s;}
.btn-send-brief:hover{opacity:.85;}
.btn-send-brief:disabled{opacity:.4;}
.send-done{padding:14px 18px;background:rgba(100,180,100,.06);border:1px solid rgba(100,180,100,.15);font-size:13px;color:var(--p1);line-height:1.7;display:none;}
.send-err{font-size:11px;color:#d48888;display:none;padding:8px 0;}
@media(max-width:760px){.chat-wrap{padding:90px 16px 0;}.chat-input-area{padding:16px;}.gen-canvas-wrap{width:240px;height:300px;}.gen-bar{width:240px;}.msg.ai .msg-bubble,.msg.user .msg-bubble{max-width:90%;}}
</style>
</head>
<body>
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="gen-overlay" id="genOverlay">
  <div class="gen-canvas-wrap">
    <div class="gen-corner tl"></div><div class="gen-corner tr"></div>
    <div class="gen-corner bl"></div><div class="gen-corner br"></div>
    <div class="gen-scan"></div>
    <div class="gen-noise" id="genNoise"></div>
    <img class="gen-img" id="genImg" src="" alt="">
  </div>
  <div class="gen-bar"><div class="gen-bar-fill" id="genBarFill"></div></div>
  <div class="gen-status-wrap">
    <div class="gen-title">Good Ereseh &middot; Commission Assistant</div>
    <div class="gen-status-text" id="genStatusText">Analysing your description</div>
    <div class="gen-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<nav id="nav">
  <a href="/" class="nav-mark"><span class="mark-g">G &middot; E</span><span class="mark-sub">Good Ereseh</span></a>
  <ul class="nav-links">
    <li><a href="/gallery">Gallery</a></li><li><a href="/about">About</a></li>
    <li><a href="/commissions" class="active">Commissions</a></li>
    <li><a href="/contact">Contact</a></li>
    <li><a href="/commissions" class="nav-commission">Commission</a></li>
  </ul>
</nav>

<div class="chat-page">
  <div class="chat-wrap">
    <div class="chat-header">
      <div class="chat-avatar-large">G</div>
      <div class="chat-header-title">Commission Assistant</div>
      <div class="chat-header-sub">Good Ereseh &middot; Charcoal &amp; Graphite Artist &middot; London</div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
  </div>
</div>

<div class="chat-input-area" id="chatInputArea"></div>

<script>
const API='https://goodereseh-website-production.up.railway.app';
const chat=document.getElementById('chatMessages');
const answers={};

function scrollDown(){setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),80);}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

function addMsg(role,html){
  const isAI=role==='ai';
  const div=document.createElement('div');
  div.className='msg '+role;
  div.innerHTML=isAI?'<div class="msg-avatar">G</div><div class="msg-bubble">'+html+'</div>':'<div class="msg-bubble">'+html+'</div>';
  chat.appendChild(div);scrollDown();return div;
}

async function aiSay(html,delay=900){
  const t=addMsg('ai','<div class="typing-dots"><span></span><span></span><span></span></div>');
  await wait(delay);t.remove();addMsg('ai',html);await wait(100);scrollDown();
}

function showInput(html){
  const a=document.getElementById('chatInputArea');
  a.innerHTML='<div class="chat-input-inner">'+html+'</div>';
  a.classList.add('visible');
  a.querySelectorAll('a,button,input,textarea').forEach(el=>{
    el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hover'));
    el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hover'));
  });
}
function hideInput(){const a=document.getElementById('chatInputArea');a.classList.remove('visible');a.innerHTML='';}

async function start(){
  await wait(600);
  await aiSay('<p>Hello. I'm the commission assistant for Good Ereseh.</p><p>I'll help you build a portrait brief in five questions — then generate an AI concept so you can see the direction before committing.</p>',700);
  showInput('<button class="chat-send-btn" style="width:100%;padding:14px;" onclick="step1()">Begin &rarr;</button>');
}

async function step1(){
  hideInput();
  await aiSay('<p>Who is this portrait of?</p>',600);
  showInput('<div class="chat-text-row"><input class="chat-text-input" id="s1in" placeholder="e.g. My grandmother Rose, aged 80&hellip;" maxlength="200" autocomplete="off"><button class="chat-send-btn" id="s1btn" onclick="submitStep1()" disabled>Send</button></div>');
  const inp=document.getElementById('s1in'),btn=document.getElementById('s1btn');
  inp.addEventListener('input',()=>{btn.disabled=inp.value.trim().length<2;});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)submitStep1();});
  setTimeout(()=>inp.focus(),100);
}

async function submitStep1(){
  const val=document.getElementById('s1in').value.trim();
  if(val.length<2)return;
  answers.subject=val;hideInput();addMsg('user','<p>'+val+'</p>');await step2();
}

async function step2(){
  const first=answers.subject.split(' ')[0];
  await aiSay('<p>'+first+' &mdash; a meaningful subject.</p><p>What is this commission for?</p>',800);
  const opts=['A gift for someone special','A memorial &mdash; preserving someone's memory','A family artwork for the home','A personal collector piece','Something else'];
  showInput('<div class="chat-options">'+opts.map((o,i)=>'<button class="chat-opt" onclick="submitStep2(''+['gift','memorial','family','personal','other'][i]+'',''+o+'')">'+o+'</button>').join('')+'</div>');
}

async function submitStep2(key,label){
  answers.occasion=label;hideInput();addMsg('user','<p>'+label+'</p>');await step3();
}

async function step3(){
  await aiSay('<p>Understood. What should this artwork communicate?</p><p>Choose everything that resonates.</p>',800);
  const moods=['Strength','Tenderness','Joy','Nostalgia','Power','Serenity','Elegance','Warmth','Gravity','Mystery','Legacy','Playfulness'];
  answers.moods=[];
  showInput('<div class="chat-moods" id="moodContainer">'+moods.map(m=>'<button class="mood-chip" onclick="toggleMood(this,''+m+'')">'+m+'</button>').join('')+'</div><button class="chat-mood-confirm" id="moodConfirm" onclick="submitStep3()" disabled>Continue &rarr;</button>');
}

function toggleMood(btn,val){
  btn.classList.toggle('on');
  if(btn.classList.contains('on')){if(!answers.moods.includes(val))answers.moods.push(val);}
  else{answers.moods=answers.moods.filter(m=>m!==val);}
  const c=document.getElementById('moodConfirm');
  if(c){c.disabled=answers.moods.length===0;c.classList.toggle('ready',answers.moods.length>0);}
}

async function submitStep3(){
  if(!answers.moods.length)return;
  hideInput();addMsg('user','<p>'+answers.moods.join(', ')+'</p>');await step4();
}

async function step4(){
  const mood=answers.moods.slice(0,2).join(' and ').toLowerCase();
  await aiSay('<p>'+(mood.charAt(0).toUpperCase()+mood.slice(1))+' &mdash; noted. What size are you thinking?</p>',800);
  const sizes=[{l:'A4 Portrait',s:'210 × 297mm · From £250'},{l:'A3 Portrait',s:'297 × 420mm · From £500'},{l:'A2 Collector Piece',s:'420 × 594mm · From £900'},{l:'Large Custom',s:'Above A2 · From £1,500'}];
  showInput('<div class="chat-options">'+sizes.map(s=>'<button class="chat-opt" onclick="submitStep4(''+s.l+' ('+s.s+')')"><span style="color:var(--p1)">'+s.l+'</span><span style="display:block;font-size:10px;color:var(--g0);margin-top:2px;letter-spacing:.06em">'+s.s+'</span></button>').join('')+'</div>');
}

async function submitStep4(val){
  answers.size=val;hideInput();addMsg('user','<p>'+val+'</p>');await step5();
}

async function step5(){
  const first=answers.subject.split(' ')[0];
  await aiSay('<p>One last question.</p><p>Tell me about '+first+' &mdash; how they carry themselves, what makes them them. The more you share, the more the drawing can hold.</p>',900);
  showInput('<div style="display:flex;flex-direction:column;gap:8px;"><textarea id="s5in" rows="3" style="background:var(--c1);border:1px solid rgba(189,179,168,.1);padding:12px 14px;resize:none;width:100%;font-size:14px;color:var(--p1);font-family:var(--sans);outline:none;line-height:1.7;caret-color:#0ea5e9;" placeholder="e.g. She has kind eyes and always wore her silver hair up&hellip;" maxlength="600"></textarea><button class="chat-send-btn" style="align-self:flex-end;padding:11px 28px;" onclick="submitStep5()">Generate my concept &rarr;</button></div>');
}

async function submitStep5(){
  const val=document.getElementById('s5in').value.trim();
  answers.details=val;hideInput();
  if(val)addMsg('user','<p>'+val+'</p>');
  await aiSay('<p>Perfect. I have everything I need.</p><p>Generating your portrait concept now&hellip;</p>',700);
  await wait(600);runGeneration();
}

async function runGeneration(){
  const overlay=document.getElementById('genOverlay'),statusEl=document.getElementById('genStatusText'),barFill=document.getElementById('genBarFill'),genImg=document.getElementById('genImg'),genNoise=document.getElementById('genNoise');
  overlay.classList.add('active');
  const phases=[{text:'Analysing your description',pct:20},{text:'Composing portrait structure',pct:45},{text:'Rendering charcoal detail',pct:70},{text:'Finalising concept',pct:90}];
  const mood=answers.moods.slice(0,3).join(' ')||'dignified';
  const prompt='hyperrealistic charcoal graphite portrait '+answers.subject+' '+mood+' black white fine art pencil drawing on cotton paper dramatic lighting professional artwork';
  const seed=Math.floor(Math.random()*9999);
  const imageUrl='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=480&height=600&nologo=true&seed='+seed;
  genImg.src=imageUrl;
  for(const phase of phases){
    statusEl.style.opacity='0';await wait(200);
    statusEl.textContent=phase.text;statusEl.style.opacity='1';
    barFill.style.width=phase.pct+'%';await wait(1200);
  }
  await new Promise(resolve=>{
    if(genImg.complete&&genImg.naturalWidth>0){resolve();}
    else{genImg.onload=resolve;genImg.onerror=resolve;setTimeout(resolve,9000);}
  });
  statusEl.textContent='Concept ready';barFill.style.width='100%';
  genNoise.style.opacity='0';genImg.style.opacity='1';
  await wait(2000);
  overlay.classList.remove('active');
  await showResult(imageUrl);
}

async function showResult(imageUrl){
  await aiSay('<p>Here's your portrait concept, based on everything you've shared.</p>',600);
  addMsg('ai','<div class="concept-in-chat"><img src="'+imageUrl+'" alt="AI Portrait Concept"><div class="concept-in-chat-note">AI concept based on your description. The actual charcoal drawing will be far richer &mdash; built by hand over weeks.</div></div>');
  await wait(1000);
  await aiSay('<p>To send this brief to Good Ereseh, enter your details below. You'll hear back within two business days.</p>',900);
  addMsg('ai','<div class="brief-form-msg" id="briefForm"><input type="text" id="briefName" placeholder="Your full name" required><input type="email" id="briefEmail" placeholder="Email address" required><button class="btn-send-brief" id="sendBriefBtn" onclick="submitBrief()">Send brief to Good Ereseh &rarr;</button><div class="send-err" id="sendErr"></div></div><div class="send-done" id="sendDone"><strong style="font-family:var(--serif);font-size:17px;font-weight:300;color:var(--p2)">Brief received.</strong><br><br>Good Ereseh will review your commission and respond within two business days.</div>');
  scrollDown();
}

async function submitBrief(){
  const name=document.getElementById('briefName').value.trim(),email=document.getElementById('briefEmail').value.trim();
  const errEl=document.getElementById('sendErr'),btn=document.getElementById('sendBriefBtn');
  if(!name||!email){errEl.textContent='Please enter your name and email.';errEl.style.display='block';return;}
  const message=['Subject: '+answers.subject,'Occasion: '+answers.occasion,'Mood: '+answers.moods.join(', '),'Size: '+answers.size,'Details: '+(answers.details||'None provided')].join('
');
  btn.textContent='Sending…';btn.disabled=true;errEl.style.display='none';
  try{
    const res=await fetch(API+'/commission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,'commission-type':answers.occasion||'AI Assistant',size:answers.size||'',message})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Something went wrong.');
    document.getElementById('briefForm').style.display='none';
    document.getElementById('sendDone').style.display='block';
    scrollDown();
  }catch(err){
    errEl.textContent=err.message||'Something went wrong. Please email art@goodereseh.com directly.';
    errEl.style.display='block';btn.textContent='Send brief to Good Ereseh →';btn.disabled=false;
  }
}

const nav=document.getElementById('nav');
window.addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>60),{passive:true});
const dot=document.getElementById('cursorDot'),ring=document.getElementById('cursorRing');
if(window.matchMedia('(pointer: fine)').matches){
  let mx=0,my=0,rx=0,ry=0,tt=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';clearTimeout(tt);tt=setTimeout(()=>{const t=document.createElement('div');t.className='cursor-trail';t.style.left=mx+'px';t.style.top=my+'px';document.body.appendChild(t);t.addEventListener('animationend',()=>t.remove());},16);});
  (function loop(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop)})();
  document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hover'));el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hover'));});
}
start();
</script>
</body>
</html>
