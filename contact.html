<body>


<header>

<nav>

<div class="logo">
GOOD ERESEH

<ul>

</header>



<section class="contact-page">


<div class="contact-container">


<h1>
Enquiry
</h1>


<p>
Interested in purchasing an artwork or requesting a commission? Send a message and I will get back to you.
</p>



<form action="https://formspree.io/f/xdaqqeqv" method="POST">
<input type="hidden" name="_next" value="https://wudixo.github.io/goodereseh-website/thank-you.html">

<label>
Name
</label>

<input 
type="text" 
name="name" 
placeholder="Your name" 
required>



<label>
Email
</label>

<input 
type="email" 
name="email" 
placeholder="Your email" 
required>



<label>
Phone Number (Optional)
</label>

<input 
type="tel" 
name="phone" 
placeholder="Your phone number">



<label>
Enquiry Type
</label>

<select name="enquiry_type">

<option>
Purchase Existing Artwork
</option>

<option>
Commission New Artwork
</option>

</select>



<label>
Artwork Interested In
</label>

<input 
type="text" 
id="artwork" 
name="artwork" 
placeholder="Artwork name">



<label>
Preferred Artwork Size
</label>

<select name="size">

<option>
A4
</option>

<option>
A3
</option>

<option>
A2
</option>

<option>
A1
</option>

<option>
Custom Size
</option>

</select>



<label>
Budget Range
</label>

<select name="budget">

<option>
Under £250
</option>

<option>
£250 - £500
</option>

<option>
£500 - £1000
</option>

<option>
£1000+
</option>

</select>



<label>
Message
</label>

<textarea 
name="message" 
placeholder="Tell me about your request">
</textarea>



<button type="submit">
Send Enquiry
</button>


</form>


</div>


</section>



<script src="js/app.js"></script>


</body>

</html>
